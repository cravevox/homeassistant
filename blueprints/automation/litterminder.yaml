blueprint:
  name: "🐾 LitterMinder"
  description: |
    ## 🐾 LitterMinder — Smart litter box usage & cleaning tracker with reminders

    This blueprint tracks how often your litter box is used and when it was
    last cleaned, then flags it as **needs cleaning** and (optionally) sends
    you a reminder. It uses a **motion sensor** to count visits and, if you
    have one, a **door / lid sensor** to detect when you clean it.

    - **Motion sensor** — counts a "visit" each time the box is used.
    - **Dirty flag** — turns on when the box has been used too many times
      **or** too many hours have passed since the last cleaning.
    - **Mark it cleaned** — hold the box's door / lid open for a few seconds,
      tap **Mark cleaned** on the phone notification, or just switch the dirty
      flag off on your dashboard. The visit counter resets, the last-cleaned
      time updates, and the dirty flag clears.

    <details><summary><b>Quick start — just a dirty flag</b> ⚡</summary>
    <p></p>
    <p>Only the first section, <b>Litter Box — Required</b>, needs filling
    in. Every other section is optional and off by default.</p>
    <ol>
      <li>Pick your litter box <b>motion sensor</b>.</li>
      <li>For each of the three helpers, open the dropdown and choose
          <b>Create a new … helper</b>: a <b>Toggle</b> ("Litter Box Needs
          Cleaning"), a <b>Counter</b> ("Litter Box Times Used") and a
          <b>Date and time</b> with <b>both date and time</b> ticked ("Litter
          Box Last Cleaned").</li>
      <li>(Optional) Pick a door / lid sensor. Without one, switch the dirty
          toggle off when you clean.</li>
      <li>Save. Then set "Last Cleaned" to now and the counter to 0 so you
          start from a clean slate.</li>
    </ol>
    <p>Add a Tile card for the dirty toggle and you're done. To get reminded,
    open <b>Mobile notifications</b> next.</p>
    </details>

    <details><summary><b>Features</b> 🔔</summary>
    <p></p>
    <ul>
      <li><b>Usage tracking</b> — a <code>counter</code> helper counts each
          visit. A minimum-motion duration and a cooldown prevent
          double-counting a single visit or the cat lingering nearby.</li>
      <li><b>Three ways to mark it cleaned</b> — a human-only door / lid
          sensor held open long enough, a <b>Mark cleaned</b> button on the
          phone notification, or switching the dirty toggle off by hand.</li>
      <li><b>Dual dirty thresholds</b> — flag the box dirty after a number of
          uses <b>or</b> after a number of hours since the last cleaning,
          whichever comes first. The hours check fires on the minute — no
          polling.</li>
      <li><b>Repeat reminders</b> — optionally nag again every few hours while
          the box stays dirty.</li>
      <li><b>Mobile push notifications</b> — with a <b>Mark cleaned</b>
          button. The reminder is replaced, not stacked, and disappears from
          your phone once the box is cleaned.</li>
      <li><b>Alexa announcements</b> — announce on one or more Echo devices via
          the Alexa Media Player integration.</li>
      <li><b>TTS (text-to-speech) / Speaker announcements</b> — announce on any
          speaker using a Home Assistant TTS engine (Google TTS, Home Assistant
          Voice, Piper, Nabu Casa Cloud, OpenAI, and more). Supports two TTS
          engines for mixed speaker setups.</li>
      <li><b>Quiet hours</b> — suppress reminders during sleeping hours with
          per-channel control (e.g. silence speakers but keep mobile alerts).
          Dashboard helpers still update. Set times manually or use a Schedule
          helper to share quiet hours across multiple automations.</li>
      <li><b>Usage trends &amp; health alerts</b> — optionally count every
          visit into lifetime, per-day, and per-week <code>counter</code>
          helpers for graphs, and get an alert when today's visits are far
          above or below your cat's normal range.</li>
      <li><b>Air purifier boost</b> — optionally run an air purifier or fan
          at a chosen speed after the cat leaves or after you clean, for a set
          time, then put it <b>back how it was</b> (e.g. Auto mode) — unless
          you changed it yourself in the meantime.</li>
      <li><b>Dashboard helpers</b> — the dirty <code>input_boolean</code>, the
          last-cleaned <code>input_datetime</code>, and the visit
          <code>counter</code> all double as dashboard indicators.</li>
    </ul>
    </details>

    <details><summary><b>Setup guide &amp; testing</b> 🛠️</summary>
    <p></p>
    <ol>
      <li>Fill in <b>Litter Box — Required</b> (see Quick start above).</li>
      <li>Check <b>When to Flag Dirty &amp; Remind</b> — the defaults are 5
          uses or 16 hours.</li>
      <li>(Optional) Turn on <b>Mobile</b>, <b>Alexa</b>, or <b>TTS</b>
          reminders, and set <b>Quiet hours</b>.</li>
      <li>(Optional) <b>Usage Trends &amp; Health</b> and <b>Air Purifier
          Boost</b> each need one or two extra helpers — see their sections
          below.</li>
      <li>(Optional) Fine-tune <b>Detection Tuning</b> only if you get double
          counts or missed cleanings.</li>
      <li><b>Test your notifications:</b> Developer Tools → Actions →
          <code>automation.trigger</code>, select this automation, and run it.
          A test message goes to <b>every</b> configured channel. It does not
          change any helper.</li>
    </ol>
    <p></p>
    <h4>How cleaning detection works</h4>
    <p>With a door / lid sensor, the box is marked cleaned when the sensor
    stays <b>open</b> for at least the "minimum door open time". That is what
    separates a real cleaning from a cat nudging the sensor — a cat won't hold
    the door open for 20 seconds. You don't need to wait for the door to
    close. Visits aren't counted while the door is open.</p>
    <p>Switching the dirty toggle off <b>yourself</b> (dashboard, app, voice)
    also counts as a cleaning. Changes the blueprint makes itself never do.
    Turn this off under Required if you'd rather the toggle only clear the
    flag.</p>
    </details>

    <details><summary><b>Quiet hours</b> 🌙</summary>
    <p></p>
    <p>Suppress reminders during quiet hours — with per-channel control. For
    example, silence Alexa and TTS speakers at night while still receiving
    mobile push notifications. Dashboard helpers still update normally, so the
    dirty flag and counter always reflect the current state. Two modes are
    available:</p>
    <ul>
      <li><b>Manual times</b> — set a start and end time. If the end time is
          earlier than the start time, the window wraps over midnight
          (e.g. 10:00 PM to 7:00 AM).</li>
      <li><b>Schedule helper</b> — use a <code>schedule</code> helper entity to
          define quiet hours. When the schedule is "on", reminders are
          suppressed. Useful if you want to share the same quiet hours across
          multiple automations from a single helper.</li>
    </ul>
    <p>A reminder that falls in quiet hours is skipped, not delayed. Repeat
    reminders pick up again at their next interval.</p>
    </details>

    <details><summary><b>Usage trends, graphs &amp; health alerts</b> 📈</summary>
    <p></p>
    <p>Watching how often your cat uses the box each day is one of the easiest
    early health signals you can get. Setup takes three helpers, all created
    in the UI — no YAML:</p>
    <ol>
      <li><b>Lifetime visits counter</b> (required for graphs) — create a
          <b>Counter</b> right from the "Total visits — lifetime" dropdown in
          <b>Usage Trends &amp; Health</b>. The blueprint adds 1 per visit and
          never resets it.</li>
      <li><b>Graphable sensor</b> — Home Assistant only keeps long-term
          statistics (the per-day graphs) for <i>sensors</i>, not counters.
          Go to Settings → Devices &amp; services → Helpers → Create helper →
          <b>Template</b> → <b>Template a sensor</b>, and set:
        <ul>
          <li>State: <code>{{ states('counter.YOUR_LIFETIME_COUNTER') }}</code></li>
          <li>State class: <b>Total increasing</b></li>
          <li>Under advanced options, Availability:
              <code>{{ has_value('counter.YOUR_LIFETIME_COUNTER') }}</code>
              — this stops a restart from being counted as a burst of
              visits.</li>
        </ul>
      </li>
      <li><b>Dashboard card</b> — add a <b>Statistics graph</b> card for that
          sensor with Period: <b>Day</b>, Stat type: <b>Change</b>, Chart
          type: <b>Bar</b>, Days to show: <b>14</b>. Each bar is one day's
          visit count. Add a <b>Statistic</b> card (Stat type: Change, Period:
          rolling window of 7 days) for a "visits in the last week" total.</li>
    </ol>
    <p><b>Health alerts</b> need the <b>Visits today</b> counter. Watch your
    graph for a week or two, then set the normal range. You get one alert
    the moment today's visits go <b>above</b> the maximum (frequent small
    visits can mean a urinary problem — in male cats a blockage is an
    emergency). You also get one at the daily reset time if the day ended
    <b>below</b> the minimum. Alerts use the same channels and quiet hours as
    reminders. LitterMinder is not a vet — if in doubt, call yours.</p>
    <p>The <b>Visits this week</b> counter is kept for older setups — the
    statistics graph above makes it unnecessary.</p>
    </details>

    <details><summary><b>Air purifier boost</b> 💨</summary>
    <p></p>
    <p>Enable the <b>Air Purifier Boost</b> section to clear odor after each
    visit. Works with any <code>fan</code> entity — most smart purifiers
    (Levoit / VeSync, Winix, Xiaomi, etc.) appear as fans. You also need a
    <b>Timer</b> helper (tick <b>Restore</b>; no duration needed — the
    blueprint sets it).</p>
    <p><b>How it works:</b></p>
    <ol>
      <li>After a visit, once the motion sensor has been clear for your
          <b>start delay</b> (so the fan doesn't spook the cat) — or right
          away when you clean the box — the blueprint snapshots the
          purifier's current setting (on/off, Auto/Sleep preset, or speed).</li>
      <li>It sets your <b>boost speed</b> and runs for your <b>boost
          duration</b>. Another visit during the boost restarts the clock.</li>
      <li>When the boost ends, the purifier is put back how it was — back to
          Auto, back off, back to its old speed. If <b>you</b> changed the
          purifier during the boost, it is left alone.</li>
    </ol>
    <p><b>Choosing a boost speed:</b> look at your fan in Developer Tools →
    States. <code>percentage_step</code> tells you which percentages it
    supports (e.g. 25 → 25 / 50 / 75 / 100) and <code>preset_modes</code>
    lists the preset names. For most purifiers, <b>Percentage</b> is the right
    choice for a boost — presets are usually Auto / Sleep.</p>
    <p><b>Restarts:</b> when Home Assistant shuts down or restarts normally
    during a boost, the purifier is put back first, so nothing is lost. Only
    after a crash or power cut does the purifier go to the <b>fallback
    preset</b> instead (e.g. <code>auto</code>; blank = off). "Just turn on"
    mode assumes the purifier is normally off or in the fallback preset.</p>
    </details>

    ---

    **Author:** CraveVox
    **Version:** 1.2.0
    **Last updated:** 2026-11-01

  domain: automation
  source_url: https://github.com/cravevox/homeassistant/blob/main/blueprints/automation/litterminder.yaml
  author: CraveVox
  homeassistant:
    min_version: "2024.10.0"

  input:
    # =========================================================================
    #  SECTION 1 — REQUIRED: SENSORS & HELPERS
    # =========================================================================
    core_section:
      name: "Litter Box — Required"
      icon: mdi:cat
      collapsed: false
      description: >
        The only section you must fill in: your motion sensor and three
        helpers (create each from its dropdown). The door / lid sensor is
        optional.
      input:
        motion_sensor:
          name: "Motion sensor (required)"
          description: >
            A binary sensor that detects motion at the litter box. Each time
            the box is used, this counts a visit. Position it so it only sees
            the box, not general room traffic.
          selector:
            entity:
              multiple: false
              filter:
                - domain: binary_sensor

        dirty_boolean:
          name: "Needs-cleaning toggle (required)"
          description: >
            A Toggle (input_boolean) that turns ON when the box needs cleaning
            and OFF when it's cleaned. Doubles as a dashboard indicator. Pick
            "Create a new Toggle helper" if you don't have one (e.g. "Litter
            Box Needs Cleaning").
          selector:
            entity:
              multiple: false
              filter:
                - domain: input_boolean

        usage_counter:
          name: "Times-used counter (required)"
          description: >
            A Counter that counts visits since the last cleaning and resets to
            0 when the box is cleaned. Pick "Create a new Counter helper" if
            you don't have one (e.g. "Litter Box Times Used").
          selector:
            entity:
              multiple: false
              filter:
                - domain: counter

        last_cleaned_datetime:
          name: "Last-cleaned date & time (required)"
          description: >
            A Date and/or time (input_datetime) helper with BOTH date and time
            enabled. Records when the box was last cleaned and drives the
            hours threshold. Pick "Create a new Date and/or time helper" if
            you don't have one (e.g. "Litter Box Last Cleaned").
          selector:
            entity:
              multiple: false
              filter:
                - domain: input_datetime

        clean_door_sensor:
          name: "Door / lid sensor for cleaning (optional)"
          description: >
            A binary sensor on the door, lid, or nearby cabinet you open to
            clean the box. Holding it open for the "minimum door open time"
            (Detection Tuning) marks the box cleaned. Choose a sensor a cat
            can't trigger by brushing past. Leave blank if you don't have
            one — mark it cleaned from the dashboard or the notification
            instead.
          default: []
          selector:
            entity:
              multiple: false
              filter:
                - domain: binary_sensor

        clean_on_toggle_off:
          name: "Switching the toggle off by hand counts as a cleaning"
          description: >
            If ON, switching the needs-cleaning toggle off yourself (dashboard,
            app, voice) also resets the counter and the last-cleaned time —
            the easy way to log a cleaning without a door sensor. Changes made
            by automations never count. Turn OFF if you only want the toggle
            to clear the flag.
          default: true
          selector:
            boolean: {}

    # =========================================================================
    #  SECTION 2 — WHEN TO FLAG DIRTY & REMIND
    # =========================================================================
    thresholds_section:
      name: "When to Flag Dirty & Remind"
      icon: mdi:broom
      collapsed: true
      description: >
        The box is flagged dirty when EITHER threshold is met — whichever comes
        first. Reminders go to the channels you enable below.
      input:
        dirty_after_uses:
          name: "Flag dirty after this many uses"
          description: >
            Turn the dirty flag on once the visit counter reaches this many
            uses since the last cleaning.
          default: 5
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: uses
              mode: slider

        dirty_after_hours:
          name: "Flag dirty after this many hours since last cleaned"
          description: >
            Turn the dirty flag on once this many hours have passed since the
            last cleaning, even if the use count is low. Checked every minute.
          default: 16
          selector:
            number:
              min: 1
              max: 168
              step: 1
              unit_of_measurement: h
              mode: slider

        reminder_repeat_hours:
          name: "Repeat the reminder every … hours while dirty (0 = off)"
          description: >
            Send the reminder again every this many hours for as long as the box
            stays dirty. 0 sends it only once. The interval counts from when
            the flag turned on (or from the last Home Assistant restart).
          default: 0
          selector:
            number:
              min: 0
              max: 24
              step: 1
              unit_of_measurement: h
              mode: slider

    # =========================================================================
    #  SECTION 3 — MOBILE NOTIFICATIONS (OPTIONAL)
    # =========================================================================
    mobile_section:
      name: "Mobile notifications"
      icon: mdi:cellphone
      collapsed: true
      description: >
        Send a push notification to one or more Home Assistant Companion app
        devices when the litter box needs cleaning.
      input:
        send_mobile_notifications:
          name: Enable mobile notifications
          description: >
            If enabled, a push notification is sent to the selected devices
            when the box is flagged as needing cleaning.
          default: false
          selector:
            boolean: {}

        mobile_devices:
          name: Mobile devices
          description: >
            Select one or more Home Assistant Companion app devices to receive
            notifications.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app

        mobile_title:
          name: "Notification title (mobile)"
          description: >
            Title for the mobile push notification.
          default: "LitterMinder"
          selector:
            text: {}

        mobile_message:
          name: "Notification message (mobile)"
          description: >
            Message body for the mobile push notification.
          default: "🐾 The litter box needs cleaning."
          selector:
            text:
              multiline: true

        mobile_mark_cleaned_button:
          name: 'Add a "Mark cleaned" button'
          description: >
            Adds a "Mark cleaned" button to the reminder. Tapping it records a
            cleaning, the same as opening the door / lid. The reminder is also
            cleared from every phone once the box is cleaned.
          default: true
          selector:
            boolean: {}

    # =========================================================================
    #  SECTION 4 — ALEXA ANNOUNCEMENTS (OPTIONAL)
    # =========================================================================
    alexa_section:
      name: "Alexa announcements"
      icon: mdi:speaker-message
      collapsed: true
      description: >
        Announce on Amazon Echo devices using the Alexa Media Player
        integration when the box needs cleaning. Requires the Alexa Media
        Player custom component (available via HACS).
      input:
        enable_alexa:
          name: Enable Alexa announcements
          description: >
            If enabled, an announcement plays on the selected Echo devices when
            the box needs cleaning.
          default: false
          selector:
            boolean: {}

        alexa_targets:
          name: Alexa media player targets
          description: >
            Select one or more Echo/Alexa media player entities to announce on.
            These must be media_player entities from the Alexa Media Player
            integration.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player

        alexa_announce_type:
          name: Alexa announcement type
          description: >
            "Announce" plays the standard Alexa chime before the message.
            "TTS" plays the message directly without a chime.
          default: "announce"
          selector:
            select:
              multiple: false
              options:
                - label: Announce (with chime)
                  value: "announce"
                - label: TTS (no chime)
                  value: "tts"

        alexa_service_name:
          name: Alexa notify service name
          description: >
            The name of your Alexa Media Player notify service. Most
            installations use the default "notify.alexa_media", but if you
            renamed it or have multiple Alexa integrations, enter your service
            name here.
          default: "notify.alexa_media"
          selector:
            text: {}

        alexa_message:
          name: "Announcement message (Alexa)"
          description: >
            Message to announce on Alexa when the box needs cleaning.
          default: "The litter box needs cleaning."
          selector:
            text:
              multiline: true

    # =========================================================================
    #  SECTION 5 — TTS / SPEAKER ANNOUNCEMENTS (OPTIONAL)
    # =========================================================================
    tts_section:
      name: "TTS (text-to-speech) / Speaker announcements"
      icon: mdi:speaker-message
      collapsed: true
      description: >
        Announce on any speaker using a Home Assistant TTS (text-to-speech)
        engine — Google TTS, Home Assistant Voice, Piper, Nabu Casa Cloud, and
        more. Supports two TTS engines for mixed speaker setups.
      input:
        enable_tts:
          name: Enable TTS / Speaker announcements
          description: >
            If enabled, a TTS announcement plays on the selected speakers when
            the box needs cleaning. You must also select a TTS engine entity
            and at least one speaker below.
          default: false
          selector:
            boolean: {}

        tts_primary_entity:
          name: Primary TTS engine entity
          description: >
            The TTS engine to use for the primary speakers. The dropdown shows
            whichever TTS integrations you have installed (e.g. Google
            Translate, Piper, Nabu Casa Cloud, OpenAI, Google AI, etc.).
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: tts

        tts_primary_targets:
          name: Primary media player targets
          description: >
            Select one or more media player entities to announce on using the
            primary TTS engine.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player

        tts_secondary_entity:
          name: Secondary TTS engine entity (optional)
          description: >
            Optional second TTS engine for a different set of speakers. Leave
            empty if you only use one TTS engine.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: tts

        tts_secondary_targets:
          name: Secondary media player targets
          description: >
            Select one or more media player entities to announce on using the
            secondary TTS engine.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player

        tts_message:
          name: "Announcement message (TTS)"
          description: >
            Message to announce on TTS speakers when the box needs cleaning.
          default: "The litter box needs cleaning."
          selector:
            text:
              multiline: true

    # =========================================================================
    #  SECTION 6 — QUIET HOURS (OPTIONAL)
    # =========================================================================
    quiet_hours_section:
      name: "Quiet hours"
      icon: mdi:moon-waning-crescent
      collapsed: true
      description: >
        Suppress reminders during quiet hours — choose which channels to
        silence and which to keep. For example, suppress Alexa and TTS speakers
        at night but still receive mobile push notifications. Dashboard helpers
        still update normally. Choose between setting times manually or using a
        Schedule helper to centralize quiet hours across multiple automations.
      input:
        quiet_hours_mode:
          name: Quiet hours mode
          description: >
            **Disabled** — no quiet hours, reminders sent anytime.
            **Manual times** — set start and end times below.
            **Schedule helper** — use a Schedule helper entity. When the
            schedule is "on", reminders are suppressed.
          default: "disabled"
          selector:
            select:
              multiple: false
              mode: dropdown
              options:
                - label: Disabled
                  value: "disabled"
                - label: Manual times (set below)
                  value: "manual"
                - label: Schedule helper
                  value: "schedule"

        quiet_hours_schedule:
          name: "Schedule helper (schedule mode only)"
          description: >
            A Schedule helper entity that defines your quiet hours. When the
            schedule is "on", reminders are suppressed. Only used if quiet
            hours mode is "Schedule helper" above.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: schedule

        quiet_hours_start:
          name: "Start time (manual mode only)"
          description: >
            The time quiet hours begin (local time). Only used if quiet hours
            mode is "Manual times" above.
          default: "22:00:00"
          selector:
            time: {}

        quiet_hours_end:
          name: "End time (manual mode only)"
          description: >
            The time quiet hours end (local time). If the end time is earlier
            than the start time, the window wraps over midnight (e.g. 10:00 PM
            to 7:00 AM). Only used if quiet hours mode is "Manual times" above.
          default: "07:00:00"
          selector:
            time: {}

        quiet_hours_channels:
          name: "Channels to suppress during quiet hours"
          description: >
            Select which channels to suppress during quiet hours. Channels
            **not** in this list still send reminders during quiet hours.
          default:
            - "mobile"
            - "alexa"
            - "tts"
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
                - label: Mobile notifications
                  value: "mobile"
                - label: Alexa announcements
                  value: "alexa"
                - label: TTS / Speaker announcements
                  value: "tts"

    # =========================================================================
    #  SECTION 7 — USAGE TRENDS & HEALTH (OPTIONAL)
    # =========================================================================
    trends_section:
      name: "Usage Trends & Health"
      icon: mdi:chart-line
      collapsed: true
      description: >
        Track how many times a day the box is used so you can spot health
        trends, and optionally get an alert when a day is far outside the
        normal range. See "Usage trends, graphs & health alerts" at the top
        for the no-YAML setup.
      input:
        enable_trends:
          name: Enable usage-trend tracking
          description: >
            If enabled, each counted visit also increments the trend counters
            below.
          default: false
          selector:
            boolean: {}

        total_counter:
          name: "Total visits — lifetime (counter, never resets) — needed for graphs"
          description: >
            Counts every visit and is never reset by this blueprint. This is
            the source for the per-day statistics graph — without it, trend
            graphs stay at 0. Use the "Create a new Counter helper" option in
            the dropdown (e.g. "Litter Box Lifetime Visits").
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: counter

        daily_counter:
          name: "Visits today (counter, auto-resets daily) — needed for health alerts"
          description: >
            A "so far today" number for your dashboard, and the source for
            health alerts. Resets at the daily reset time below. Leave blank to
            skip.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: counter

        weekly_counter:
          name: "Visits this week (counter, auto-resets weekly) — optional"
          description: >
            Counts visits since the weekly reset day below. Kept for older
            setups; the statistics graph makes it unnecessary. Leave blank to
            skip.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: counter

        daily_reset_time:
          name: "Daily reset time"
          description: >
            The time each day when the "Visits today" counter resets to 0
            (local time). The "Visits this week" counter resets at this same
            time on the weekly reset day. The low-usage health check runs just
            before the reset.
          default: "00:00:00"
          selector:
            time: {}

        weekly_reset_day:
          name: "Weekly reset day"
          description: >
            The day of the week when the "Visits this week" counter resets to 0
            (at the daily reset time).
          default: "0"
          selector:
            select:
              multiple: false
              mode: dropdown
              options:
                - label: Monday
                  value: "0"
                - label: Tuesday
                  value: "1"
                - label: Wednesday
                  value: "2"
                - label: Thursday
                  value: "3"
                - label: Friday
                  value: "4"
                - label: Saturday
                  value: "5"
                - label: Sunday
                  value: "6"

        enable_health_alert:
          name: Enable unusual-usage health alerts
          description: >
            Alert when today's visits go above the maximum, or a day ends below
            the minimum. Needs usage-trend tracking and the "Visits today"
            counter. Uses the reminder channels and quiet hours.
          default: false
          selector:
            boolean: {}

        health_max_visits:
          name: "Alert when visits today go above (0 = off)"
          description: >
            One alert the moment today's visits pass this number. Set it a
            little above your cat's busiest normal day.
          default: 12
          selector:
            number:
              min: 0
              max: 50
              step: 1
              unit_of_measurement: visits
              mode: slider

        health_min_visits:
          name: "Alert when a whole day has fewer than (0 = off)"
          description: >
            One alert at the daily reset time if the day just ended had fewer
            visits than this. Set it a little below your cat's quietest
            normal day.
          default: 2
          selector:
            number:
              min: 0
              max: 20
              step: 1
              unit_of_measurement: visits
              mode: slider

    # =========================================================================
    #  SECTION 8 — AIR PURIFIER BOOST (OPTIONAL)
    # =========================================================================
    purifier_section:
      name: "Air Purifier Boost"
      icon: mdi:air-purifier
      collapsed: true
      description: >
        Run an air purifier or fan at a boost speed after the cat leaves or
        after you clean, then put it back how it was (e.g. Auto). Needs a
        Timer helper. See "Air purifier boost" at the top for details.
      input:
        enable_purifier:
          name: Enable air purifier boost
          default: false
          selector:
            boolean: {}

        purifier_fan:
          name: "Air purifier / fan"
          description: >
            The fan entity for your purifier (e.g. fan.core_400s_series).
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: fan

        purifier_timer:
          name: "Boost timer (timer helper)"
          description: >
            A Timer helper the blueprint uses to time the boost. Create one with
            the "Create a new Timer helper" option (e.g. "Litter Box Purifier
            Boost") and tick "Restore" so a restart mid-boost still ends it.
            Use one timer per LitterMinder automation.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: timer

        purifier_delay_minutes:
          name: "Start delay — minutes after the cat leaves"
          description: >
            How long the motion sensor must be clear before the boost starts,
            so the fan doesn't startle the cat. 0 starts as soon as motion
            clears.
          default: 2
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider

        purifier_run_minutes:
          name: "Boost duration"
          description: >
            How long to run at boost speed before restoring the purifier's
            previous setting. A new visit during the boost restarts this clock.
          default: 15
          selector:
            number:
              min: 1
              max: 120
              step: 1
              unit_of_measurement: min
              mode: slider

        purifier_boost_on_clean:
          name: "Also boost when the box is cleaned"
          description: >
            Start a boost right away when a cleaning is recorded (door / lid,
            notification button, or toggle), since scooping stirs up odor too.
          default: true
          selector:
            boolean: {}

        purifier_speed_mode:
          name: "Boost speed type"
          description: >
            **Percentage** — set a fan speed (best for most purifiers).
            **Preset** — switch to a named preset like "turbo".
            **Just turn on** — turn on without changing the speed (for a
            purifier that is normally off).
          default: "percentage"
          selector:
            select:
              multiple: false
              options:
                - label: Percentage
                  value: "percentage"
                - label: Preset mode
                  value: "preset"
                - label: Just turn on
                  value: "on"

        purifier_percentage:
          name: "Boost speed (percentage mode)"
          description: >
            Use a multiple of your fan's percentage_step attribute — e.g. a
            Levoit Core 400S has a step of 25, so 25 / 50 / 75 / 100.
          default: 50
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        purifier_preset:
          name: "Boost preset (preset mode)"
          description: >
            The exact preset name from your fan's preset_modes attribute
            (case-sensitive). Only used if speed type is "Preset mode".
          default: ""
          selector:
            text: {}

        purifier_fallback_preset:
          name: "Fallback after a crash (preset name, blank = off)"
          description: >
            A normal shutdown or restart puts the purifier back before Home
            Assistant stops, so this is only used after a crash or power cut
            during a boost, when the original setting is gone. The purifier is
            set to this preset (e.g. "auto", case-sensitive), or turned off if
            blank.
          default: ""
          selector:
            text: {}

        purifier_skip_quiet:
          name: "Skip the boost during quiet hours"
          description: >
            If enabled, no boost runs during the quiet hours set in the "Quiet
            hours" section (e.g. keep the purifier in Sleep mode overnight).
          default: false
          selector:
            boolean: {}

    # =========================================================================
    #  SECTION 9 — DETECTION TUNING (ADVANCED)
    # =========================================================================
    tuning_section:
      name: "Detection Tuning (advanced)"
      icon: mdi:tune
      collapsed: true
      description: >
        Fine-tune how visits and cleanings are detected. The defaults work for
        most setups — adjust these only if you see double counts, missed
        visits, or missed cleanings.
      input:
        min_motion_on_seconds:
          name: "Minimum motion duration to count a visit (seconds)"
          description: >
            The motion sensor must stay ON continuously for this long before a
            visit is counted. Keep this LOW (1–2s): most PIR / occupancy
            sensors pulse on and off during a single visit, so a high value
            means the sensor rarely stays on long enough and visits get
            missed. Raise it only if brief motion (a cat merely walking past)
            causes false counts.
          default: 1
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: s
              mode: slider

        motion_off_cooldown_seconds:
          name: "Cooldown between counted visits (seconds)"
          description: >
            The minimum time that must pass after a counted visit before
            another visit can be counted. Prevents a single visit (where the
            motion sensor flickers on and off) from being counted several
            times. Raise it if one visit is counted multiple times.
          default: 90
          selector:
            number:
              min: 5
              max: 600
              step: 5
              unit_of_measurement: s
              mode: slider

        min_door_open_seconds_for_clean:
          name: "Minimum door open time to count as a cleaning (seconds)"
          description: >
            The cleaning door / lid sensor must stay OPEN for this long before
            a cleaning is recorded. This is what separates a real cleaning from
            a cat nudging the sensor. Raise it if accidental bumps register as
            cleanings; lower it if quick cleanings are missed.
          default: 20
          selector:
            number:
              min: 1
              max: 600
              step: 1
              unit_of_measurement: s
              mode: slider

# =============================================================================
#  ARCHITECTURE
# =============================================================================
# Event-driven, no polling. The motion sensor and the three helpers are
# REQUIRED; every optional entity defaults to "" or [] and is guarded before
# use (a state trigger with `entity_id: []` simply never fires).
#
#   Trigger "visit"            — motion ON for the minimum duration -> count a visit
#   Trigger "cleaned"          — door/lid OPEN for the minimum duration -> cleaned
#   Trigger "mark_cleaned"     — "Mark cleaned" tapped on a mobile notification
#                                (filtered to this automation's action id)
#   Trigger "toggled_off"      — dirty toggle switched off BY A USER
#                                (context.user_id set) -> cleaned
#   Trigger "hours_elapsed"    — template, re-rendered each minute because of
#                                now(): fires once when hours-since-cleaned
#                                crosses the threshold, re-arms when cleaned
#   Trigger "repeat_reminder"  — template: true for a ~2-minute window every
#                                N hours while dirty -> one repeat per interval
#   Trigger "trend_reset"      — daily reset time -> low-usage health check,
#                                then reset today/week counters
#   Trigger "purifier_start"   — motion clear for the start delay after a
#                                visit -> snapshot fan, boost, start timer
#                                (cleanings start the boost directly)
#   Trigger "purifier_end"     — boost timer finished -> restore the snapshot
#                                if the fan is still at the boost setting
#   Trigger "purifier_shutdown"— HA stopping -> restore now while the in-memory
#                                snapshot still exists, cancel the timer
#                                (shutdown runs get 20 s; every call here is
#                                near-instant)
#   Trigger "ha_start"         — HA start -> after a crash, a timer that expired
#                                while HA was down fires timer.finished before
#                                automations load, so restore any leftover
#                                boost (fallback preset); then re-check dirty,
#                                since template triggers don't fire if already
#                                true at startup
#   Manual (no trigger)        — automation.trigger -> test notifications only
#
# Flow: one top-level `variables` block works out what this run must do
# (is_cleaning, visit_counts, boost_now, restore_action). Each block below is
# guarded by those flags, so no block depends on an earlier `stop`. After the
# helpers are updated, a second `variables` block reads the counter live and
# builds `notify_kinds` (dirty / repeat / health_high / health_low / test),
# and ONE sender loops over it, so every channel shares one code path.
# Only top-level variables are re-assigned, so this does not rely on the
# 2025.4 variable-scoping change.
#
# Purifier boost keeps no wait/delay inside the run (that would block the
# queue): the timer helper holds the boost duration, and the fan's prior
# setting is snapshotted with scene.create and restored with scene.turn_on
# (fan reproduce-state restores on/off, preset_mode and percentage correctly,
# e.g. VeSync "auto" with percentage null). "Still at the boost setting"
# means: fan on, the last state write has no user_id, and the percentage is
# within one percentage_step of the target (fans round to their steps) /
# the preset matches / (on mode) not already in the fallback preset.
#
# mode: queued guarantees no trigger is ever dropped (the old design used
# mode: parallel with wait_for_trigger, which could silently drop the cleaning
# trigger when motion runs piled up — the root cause of "cleaning stopped
# updating state"). All actions here are near-instant, so queuing is cheap.
#
# Cleaning uses a `for:` duration on the door OPEN trigger instead of waiting
# for the door to close, so there is no race and no dependency on a close event.
#
# Hours-since-cleaned is computed from the input_datetime `timestamp` attribute
# (always timezone-correct) rather than parsing the state string with
# as_datetime (which is affected by the HA input_datetime timezone quirks —
# see home-assistant/core#174351). A time-only helper (has_date false) is
# ignored rather than read as "seconds since midnight".
# =============================================================================

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  tv_dirty: !input dirty_boolean
  tv_last_cleaned: !input last_cleaned_datetime
  tv_hours: !input dirty_after_hours
  tv_repeat_hours: !input reminder_repeat_hours
  tv_clean_on_toggle: !input clean_on_toggle_off

triggers:
  - trigger: state
    id: visit
    entity_id: !input motion_sensor
    to: "on"
    for:
      seconds: !input min_motion_on_seconds

  - trigger: state
    id: cleaned
    entity_id: !input clean_door_sensor
    to: "on"
    for:
      seconds: !input min_door_open_seconds_for_clean

  - trigger: event
    id: mark_cleaned
    event_type: mobile_app_notification_action

  - trigger: state
    id: toggled_off
    entity_id: !input dirty_boolean
    from: "on"
    to: "off"

  - trigger: template
    id: hours_elapsed
    value_template: >-
      {% set ts = state_attr(tv_last_cleaned, 'timestamp') %}
      {{ is_number(ts)
         and state_attr(tv_last_cleaned, 'has_date') == true
         and (now().timestamp() - ts | float(0)) >= tv_hours | float(0) * 3600 }}

  - trigger: template
    id: repeat_reminder
    value_template: >-
      {% set period = tv_repeat_hours | float(0) * 3600 %}
      {% set s = states[tv_dirty] %}
      {% if period > 0 and s is not none and s.state == 'on' %}
        {% set elapsed = now().timestamp() - s.last_changed.timestamp() %}
        {{ elapsed >= period and (elapsed % period) < 120 }}
      {% else %}
        {{ false }}
      {% endif %}

  - trigger: time
    id: trend_reset
    at: !input daily_reset_time

  - trigger: state
    id: purifier_start
    entity_id: !input motion_sensor
    from: "on"
    to: "off"
    for:
      minutes: !input purifier_delay_minutes

  - trigger: event
    id: purifier_end
    event_type: timer.finished
    event_data:
      entity_id: !input purifier_timer

  - trigger: homeassistant
    id: purifier_shutdown
    event: shutdown

  - trigger: homeassistant
    id: ha_start
    event: start

# Drop runs that aren't ours before they queue: notification taps meant for
# other automations, and dirty-toggle changes not made by a person.
conditions:
  - condition: template
    value_template: >-
      {% set tid = (trigger.id | default('manual', true))
                   if trigger is defined and trigger is not none else 'manual' %}
      {% if tid == 'mark_cleaned' %}
        {% set uid = this.attributes.id | default(this.entity_id, true) %}
        {{ (trigger.event.data.action | default('')) == ('LITTERMINDER_CLEANED_' ~ uid) }}
      {% elif tid == 'toggled_off' %}
        {{ tv_clean_on_toggle == true
           and trigger.to_state.context.user_id is not none }}
      {% else %}
        {{ true }}
      {% endif %}

actions:
  # -------------------------------------------------------------------------
  #  Load inputs into variables and work out what this run must do
  # -------------------------------------------------------------------------
  - variables:
      # Core entities
      door_entity: !input clean_door_sensor
      dirty_bool: !input dirty_boolean
      last_cleaned: !input last_cleaned_datetime
      counter_entity: !input usage_counter

      # Thresholds & tuning
      uses_threshold: !input dirty_after_uses
      hours_threshold: !input dirty_after_hours
      cooldown_seconds: !input motion_off_cooldown_seconds

      # Usage trends & health
      trends_enabled: !input enable_trends
      total_counter: !input total_counter
      daily_counter: !input daily_counter
      weekly_counter: !input weekly_counter
      weekly_reset_day: !input weekly_reset_day
      health_enabled: !input enable_health_alert
      health_max: !input health_max_visits
      health_min: !input health_min_visits
      daily_ready: >-
        {{ trends_enabled and daily_counter is string and daily_counter != '' }}
      health_ready: "{{ health_enabled and daily_ready }}"
      # Today's visits BEFORE this run changes anything (used by the
      # low-usage check, which runs just before the daily reset)
      daily_before: "{{ states(daily_counter) | int(0) if daily_ready else 0 }}"

      # Air purifier boost
      purifier_enabled: !input enable_purifier
      purifier_entity: !input purifier_fan
      purifier_timer_entity: !input purifier_timer
      purifier_delay: !input purifier_delay_minutes
      purifier_run: !input purifier_run_minutes
      purifier_on_clean: !input purifier_boost_on_clean
      purifier_mode: !input purifier_speed_mode
      purifier_pct: !input purifier_percentage
      purifier_preset_var: !input purifier_preset
      purifier_fallback: !input purifier_fallback_preset
      purifier_skip_quiet_var: !input purifier_skip_quiet
      purifier_ready: >-
        {{ purifier_enabled
           and purifier_entity is string and purifier_entity != ''
           and purifier_timer_entity is string and purifier_timer_entity != '' }}
      # In-memory snapshot of the fan's prior setting, unique per automation
      purifier_scene_id: "{{ this.entity_id | replace('automation.', '') }}_purifier_snapshot"
      purifier_scene: "scene.{{ purifier_scene_id }}"

      # Notification config
      send_mobile: !input send_mobile_notifications
      mobile_devices_var: !input mobile_devices
      mobile_title_var: !input mobile_title
      mobile_message_var: !input mobile_message
      mark_button: !input mobile_mark_cleaned_button
      enable_alexa: !input enable_alexa
      alexa_targets_var: !input alexa_targets
      alexa_type: !input alexa_announce_type
      alexa_svc: !input alexa_service_name
      alexa_message_var: !input alexa_message
      enable_tts: !input enable_tts
      tts_primary_entity_var: !input tts_primary_entity
      tts_primary_targets_var: !input tts_primary_targets
      tts_secondary_entity_var: !input tts_secondary_entity
      tts_secondary_targets_var: !input tts_secondary_targets
      tts_message_var: !input tts_message
      mobile_ready: "{{ send_mobile and (mobile_devices_var | length > 0) }}"
      # Per-automation ids: the notification tag (replace / clear) and the
      # "Mark cleaned" action (matched by the top-level condition)
      # (Built straight from `this` so a numeric id is never re-typed.)
      notify_tag: >-
        {{ 'litterminder_' ~ (this.attributes.id | default(this.entity_id, true) | string | slugify) }}
      clean_action_id: >-
        {{ 'LITTERMINDER_CLEANED_' ~ (this.attributes.id | default(this.entity_id, true)) }}

      # Quiet hours
      quiet_mode: !input quiet_hours_mode
      quiet_schedule_entity: !input quiet_hours_schedule
      quiet_start: !input quiet_hours_start
      quiet_end: !input quiet_hours_end
      quiet_channels: !input quiet_hours_channels

      # Which trigger fired? ('manual' when run via automation.trigger)
      trig_id: >-
        {{ (trigger.id | default('manual', true))
           if trigger is defined and trigger is not none else 'manual' }}

      # Hours since the box was last cleaned (timezone-safe via timestamp attr).
      # If never set (or a time-only helper), treat as 0 so we never nag
      # before first setup.
      hours_since_clean: >-
        {% set ts = state_attr(last_cleaned, 'timestamp') %}
        {% if is_number(ts) and state_attr(last_cleaned, 'has_date') == true %}
          {{ ((now().timestamp() - ts | float(0)) / 3600) | round(3) }}
        {% else %}
          {{ 0 }}
        {% endif %}

      # Is the dirty flag already on right now?
      currently_dirty: "{{ is_state(dirty_bool, 'on') }}"

      # Quiet hours check (end time is exclusive — reminders resume at the end time)
      is_quiet: >-
        {% if quiet_mode == 'schedule' %}
          {% if quiet_schedule_entity is string and quiet_schedule_entity != '' %}
            {{ is_state(quiet_schedule_entity, 'on') }}
          {% else %}
            {{ false }}
          {% endif %}
        {% elif quiet_mode == 'manual' %}
          {% set start = today_at(quiet_start) %}
          {% set end_t = today_at(quiet_end) %}
          {% if start <= end_t %}
            {{ start <= now() < end_t }}
          {% else %}
            {{ now() >= start or now() < end_t }}
          {% endif %}
        {% else %}
          {{ false }}
        {% endif %}

      # --- What does this run do? -------------------------------------------
      is_cleaning: "{{ trig_id in ['cleaned', 'mark_cleaned', 'toggled_off'] }}"

      # Count the visit unless the door is open (box being cleaned) or the
      # last counted visit is within the cooldown. An unavailable door sensor
      # no longer blocks counting; a missing counter state never errors.
      visit_counts: >-
        {% if trig_id != 'visit' %}
          {{ false }}
        {% else %}
          {% set c = states[counter_entity] %}
          {% set since = (now().timestamp() - as_timestamp(c.last_changed, 0))
                         if c is not none else 999999 %}
          {% set door_open = door_entity is string and door_entity != ''
                             and is_state(door_entity, 'on') %}
          {{ not door_open and since >= cooldown_seconds | float(0) }}
        {% endif %}

      # Start (or extend) a purifier boost? After a visit only if a visit or
      # cleaning happened recently (counter / last-cleaned changed within the
      # delay + 30 min), so general motion near the box doesn't start it.
      boost_now: >-
        {% if not purifier_ready or not has_value(purifier_entity)
              or (purifier_skip_quiet_var and is_quiet) %}
          {{ false }}
        {% elif trig_id == 'purifier_start' %}
          {% set c = states[counter_entity] %}
          {% set l = states[last_cleaned] %}
          {% set last_activity = [
               as_timestamp(c.last_changed, 0) if c is not none else 0,
               as_timestamp(l.last_changed, 0) if l is not none else 0] | max %}
          {{ (now().timestamp() - last_activity)
             <= purifier_delay | float(0) * 60 + 1800 }}
        {% elif is_cleaning %}
          {{ purifier_on_clean == true }}
        {% else %}
          {{ false }}
        {% endif %}

      # Is the fan still where the boost left it? (Used at boost end, at
      # shutdown and at start-up recovery.) A user change during the boost —
      # a different speed/preset, turning it off, or any change made from the
      # UI/app (context.user_id) — means "leave it alone".
      fan_boosted: >-
        {% set f = states[purifier_entity] if purifier_ready else none %}
        {% if f is none or f.state != 'on' or f.context.user_id is not none %}
          {{ false }}
        {% elif purifier_mode == 'percentage' %}
          {% set p = f.attributes.percentage %}
          {% set step = f.attributes.percentage_step | float(1) %}
          {{ is_number(p)
             and (p | float(0) - purifier_pct | float(0)) | abs < [step, 1] | max }}
        {% elif purifier_mode == 'preset' %}
          {{ purifier_preset_var != ''
             and f.attributes.preset_mode == purifier_preset_var }}
        {% else %}
          {{ not (purifier_fallback != ''
                  and f.attributes.preset_mode == purifier_fallback) }}
        {% endif %}

      # How to end a boost: 'scene' (restore snapshot), 'fallback' (snapshot
      # lost -> fallback preset / off) or 'none'.
      restore_action: >-
        {% set scene_ok = states[purifier_scene] is not none %}
        {% if not purifier_ready or not fan_boosted %}
          none
        {% elif trig_id == 'purifier_end' %}
          {{ 'scene' if scene_ok else 'fallback' }}
        {% elif trig_id == 'purifier_shutdown' %}
          {{ 'scene' if scene_ok and is_state(purifier_timer_entity, 'active') else 'none' }}
        {% elif trig_id == 'ha_start' %}
          {{ 'fallback' if is_state(purifier_timer_entity, 'idle') else 'none' }}
        {% else %}
          none
        {% endif %}

  # -------------------------------------------------------------------------
  #  CLEANED — door/lid held open, "Mark cleaned" tapped, or toggle switched
  #  off by a person. Reset everything and clear the phone reminder.
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ is_cleaning }}"
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ last_cleaned }}"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: counter.reset
        target:
          entity_id: "{{ counter_entity }}"
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ dirty_bool }}"
      - if:
          - condition: template
            value_template: "{{ mobile_ready }}"
        then:
          - repeat:
              for_each: "{{ mobile_devices_var }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ notify_tag }}"
                  continue_on_error: true

  # -------------------------------------------------------------------------
  #  TREND RESET — daily reset time. Reset the "today" counter every day, and
  #  the "this week" counter on the chosen weekday. (The low-usage health
  #  check read the count before this, into daily_before.)
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ trig_id == 'trend_reset' and trends_enabled }}"
    then:
      - if:
          - condition: template
            value_template: "{{ daily_ready }}"
        then:
          - action: counter.reset
            target:
              entity_id: "{{ daily_counter }}"
      - if:
          - condition: template
            value_template: >-
              {{ weekly_counter is string and weekly_counter != ''
                 and now().weekday() == weekly_reset_day | int(0) }}
        then:
          - action: counter.reset
            target:
              entity_id: "{{ weekly_counter }}"

  # -------------------------------------------------------------------------
  #  VISIT — count it, plus the usage-trend counters (never reset by cleaning)
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ visit_counts }}"
    then:
      - action: counter.increment
        target:
          entity_id: "{{ counter_entity }}"
      - if:
          - condition: template
            value_template: >-
              {{ trends_enabled and total_counter is string and total_counter != '' }}
        then:
          - action: counter.increment
            target:
              entity_id: "{{ total_counter }}"
      - if:
          - condition: template
            value_template: "{{ daily_ready }}"
        then:
          - action: counter.increment
            target:
              entity_id: "{{ daily_counter }}"
      - if:
          - condition: template
            value_template: >-
              {{ trends_enabled and weekly_counter is string and weekly_counter != '' }}
        then:
          - action: counter.increment
            target:
              entity_id: "{{ weekly_counter }}"
      - if:
          - condition: template
            value_template: >-
              {{ (trends_enabled and not (total_counter is string and total_counter != ''))
                 or (health_enabled and not daily_ready) }}
        then:
          - action: system_log.write
            data:
              level: warning
              logger: blueprints.litterminder
              message: >-
                {{ this.attributes.friendly_name }}:
                {%- if trends_enabled and not (total_counter is string and total_counter != '') %}
                usage trends are enabled but no lifetime counter is selected, so
                trend graphs will stay at 0.
                {%- endif %}
                {%- if health_enabled and not daily_ready %}
                health alerts are enabled but need usage trends turned on and a
                "Visits today" counter.
                {%- endif %}
                See Usage Trends & Health.

  # -------------------------------------------------------------------------
  #  PURIFIER BOOST — after a visit (motion clear for the start delay) or a
  #  cleaning. First boost snapshots the fan; a boost already running is just
  #  extended.
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ boost_now }}"
    then:
      - if:
          - condition: template
            value_template: "{{ is_state(purifier_timer_entity, 'idle') }}"
        then:
          - action: scene.create
            data:
              scene_id: "{{ purifier_scene_id }}"
              snapshot_entities: "{{ [purifier_entity] }}"
          - choose:
              - conditions: "{{ purifier_mode == 'percentage' }}"
                sequence:
                  - action: fan.turn_on
                    target:
                      entity_id: "{{ purifier_entity }}"
                    data:
                      percentage: "{{ purifier_pct | int }}"
                    continue_on_error: true
              - conditions: "{{ purifier_mode == 'preset' and purifier_preset_var | length > 0 }}"
                sequence:
                  - action: fan.turn_on
                    target:
                      entity_id: "{{ purifier_entity }}"
                    data:
                      preset_mode: "{{ purifier_preset_var }}"
                    continue_on_error: true
            default:
              - action: fan.turn_on
                target:
                  entity_id: "{{ purifier_entity }}"
                continue_on_error: true
      # (Re)start the timer — extends a boost that is already running
      - action: timer.start
        target:
          entity_id: "{{ purifier_timer_entity }}"
        data:
          duration: "{{ (purifier_run | int(15)) * 60 }}"

  # -------------------------------------------------------------------------
  #  PURIFIER RESTORE — boost ended, HA shutting down, or leftover boost found
  #  at start-up (see restore_action above).
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ restore_action == 'scene' }}"
    then:
      - action: scene.turn_on
        target:
          entity_id: "{{ purifier_scene }}"
        continue_on_error: true

  - if:
      - condition: template
        value_template: "{{ restore_action == 'fallback' }}"
    then:
      - if:
          - condition: template
            value_template: "{{ purifier_fallback | length > 0 }}"
        then:
          - action: fan.turn_on
            target:
              entity_id: "{{ purifier_entity }}"
            data:
              preset_mode: "{{ purifier_fallback }}"
            continue_on_error: true
        else:
          - action: fan.turn_off
            target:
              entity_id: "{{ purifier_entity }}"
            continue_on_error: true

  # On shutdown, end the boost cleanly so nothing is left to recover — but
  # only while the snapshot still exists (otherwise let the restored timer
  # finish after the restart and use the fallback).
  - if:
      - condition: template
        value_template: >-
          {{ trig_id == 'purifier_shutdown' and purifier_ready
             and is_state(purifier_timer_entity, 'active')
             and states[purifier_scene] is not none }}
    then:
      - action: timer.cancel
        target:
          entity_id: "{{ purifier_timer_entity }}"
        continue_on_error: true

  # -------------------------------------------------------------------------
  #  EVALUATE — read the helpers live (after the updates above), flag dirty
  #  on the clean -> dirty transition, and decide what to announce.
  # -------------------------------------------------------------------------
  - variables:
      uses_now: "{{ states(counter_entity) | int(0) }}"
      daily_now: "{{ states(daily_counter) | int(0) if daily_ready else 0 }}"
      should_be_dirty: >-
        {{ (uses_now | int(0) >= uses_threshold | int(0))
           or (hours_since_clean | float(0) >= hours_threshold | float(0)) }}
      becomes_dirty: >-
        {{ trig_id in ['visit', 'hours_elapsed', 'ha_start']
           and should_be_dirty and not currently_dirty }}
      notify_kinds: >-
        {% set k = [] %}
        {% if trig_id == 'manual' %}
          {% set k = k + ['test'] %}
        {% endif %}
        {% if becomes_dirty %}
          {% set k = k + ['dirty'] %}
        {% endif %}
        {% if trig_id == 'repeat_reminder' and currently_dirty %}
          {% set k = k + ['repeat'] %}
        {% endif %}
        {% if visit_counts and health_ready and health_max | int(0) > 0
              and daily_now | int(0) == health_max | int(0) + 1 %}
          {% set k = k + ['health_high'] %}
        {% endif %}
        {% if trig_id == 'trend_reset' and health_ready and health_min | int(0) > 0
              and daily_before | int(0) < health_min | int(0) %}
          {% set k = k + ['health_low'] %}
        {% endif %}
        {{ k }}

  - if:
      - condition: template
        value_template: "{{ becomes_dirty }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ dirty_bool }}"

  # -------------------------------------------------------------------------
  #  SEND — one pass per notification kind, every channel shares this code.
  #  Quiet hours apply to everything except the manual test.
  # -------------------------------------------------------------------------
  - repeat:
      for_each: "{{ notify_kinds }}"
      sequence:
        - variables:
            kind: "{{ repeat.item }}"
            quiet_ok: "{{ kind == 'test' or not is_quiet }}"
            msg_mobile_title: >-
              {% if kind == 'test' %}LitterMinder — Test
              {%- elif kind in ['health_high', 'health_low'] %}{{ mobile_title_var }} — health alert
              {%- else %}{{ mobile_title_var }}{% endif %}
            msg_mobile: >-
              {% if kind == 'test' %}Manual test notification — LitterMinder is working! All notification channels are being tested.
              {%- elif kind == 'health_high' %}⚠️ Unusual litter box use: {{ daily_now }} visits today, more than your normal maximum of {{ health_max | int(0) }}. Keep an eye on your cat.
              {%- elif kind == 'health_low' %}⚠️ Unusual litter box use: only {{ daily_before }} visit{{ '' if daily_before | int(0) == 1 else 's' }} in the last day, fewer than your normal minimum of {{ health_min | int(0) }}. Keep an eye on your cat.
              {%- else %}{{ mobile_message_var }}{% endif %}
            msg_alexa: >-
              {% if kind == 'test' %}LitterMinder test notification. If you can hear this, Alexa announcements are working.
              {%- elif kind == 'health_high' %}Litter box health alert. The box has been used {{ daily_now }} times today, which is more than usual.
              {%- elif kind == 'health_low' %}Litter box health alert. The box was only used {{ daily_before }} time{{ '' if daily_before | int(0) == 1 else 's' }} in the last day, which is less than usual.
              {%- else %}{{ alexa_message_var }}{% endif %}
            msg_tts: >-
              {% if kind == 'test' %}LitterMinder test notification. If you can hear this, TTS announcements are working.
              {%- elif kind in ['health_high', 'health_low'] %}{{ msg_alexa }}
              {%- else %}{{ tts_message_var }}{% endif %}
            # Same tag for dirty/repeat so a repeat replaces the earlier
            # reminder and a cleaning clears it; health/test get their own.
            msg_mobile_data: >-
              {% if kind in ['dirty', 'repeat'] and mark_button %}
                {{ {'tag': notify_tag,
                    'actions': [{'action': clean_action_id, 'title': 'Mark cleaned'}]} }}
              {% elif kind in ['dirty', 'repeat'] %}
                {{ {'tag': notify_tag} }}
              {% else %}
                {{ {'tag': notify_tag ~ '_' ~ kind} }}
              {% endif %}

        # Mobile push
        - if:
            - condition: template
              value_template: >-
                {{ mobile_ready and (quiet_ok or 'mobile' not in quiet_channels) }}
          then:
            - repeat:
                for_each: "{{ mobile_devices_var }}"
                sequence:
                  - action: >-
                      notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                    data:
                      title: "{{ msg_mobile_title }}"
                      message: "{{ msg_mobile }}"
                      data: "{{ msg_mobile_data }}"
                    continue_on_error: true

        # Alexa announcement
        - if:
            - condition: template
              value_template: >-
                {{ enable_alexa and (alexa_targets_var | length > 0)
                   and (quiet_ok or 'alexa' not in quiet_channels) }}
          then:
            - action: "{{ alexa_svc }}"
              data:
                target: "{{ alexa_targets_var }}"
                message: "{{ msg_alexa }}"
                data:
                  type: "{{ alexa_type }}"
              continue_on_error: true

        # TTS — primary engine
        - if:
            - condition: template
              value_template: >-
                {{ enable_tts and (tts_primary_targets_var | length > 0)
                   and (tts_primary_entity_var | length > 0)
                   and (quiet_ok or 'tts' not in quiet_channels) }}
          then:
            - repeat:
                for_each: "{{ tts_primary_targets_var }}"
                sequence:
                  - action: tts.speak
                    target:
                      entity_id: "{{ tts_primary_entity_var }}"
                    data:
                      media_player_entity_id: "{{ repeat.item }}"
                      message: "{{ msg_tts }}"
                    continue_on_error: true

        # TTS — secondary engine (optional)
        - if:
            - condition: template
              value_template: >-
                {{ enable_tts and (tts_secondary_targets_var | length > 0)
                   and (tts_secondary_entity_var | length > 0)
                   and (quiet_ok or 'tts' not in quiet_channels) }}
          then:
            - repeat:
                for_each: "{{ tts_secondary_targets_var }}"
                sequence:
                  - action: tts.speak
                    target:
                      entity_id: "{{ tts_secondary_entity_var }}"
                    data:
                      media_player_entity_id: "{{ repeat.item }}"
                      message: "{{ msg_tts }}"
                    continue_on_error: true
