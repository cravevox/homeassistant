blueprint:
  name: "🐾 LitterMinder"
  description: |
    ## 🐾 LitterMinder — Smart litter box usage & cleaning tracker with reminders

    This blueprint tracks how often your litter box is used and when it was
    last cleaned, then flags it as **needs cleaning** and (optionally) sends
    you a reminder. It uses a **motion sensor** to count visits and a
    **door / lid sensor** to detect when you clean it.

    - **Motion sensor** — counts a "visit" each time the box is used.
    - **Door / lid sensor** — opening the box's door, lid, or a nearby
      cabinet door for a few seconds marks it **cleaned**: the visit counter
      resets, the last-cleaned time updates, and the dirty flag clears.
    - **Dirty flag** — turns on when the box has been used too many times
      **or** too many hours have passed since the last cleaning.

    <details><summary><b>Features</b> 🔔</summary>
    <p></p>
    <ul>
      <li><b>Usage tracking</b> — a <code>counter</code> helper counts each
          visit. A minimum-motion duration and a cooldown prevent
          double-counting a single visit or the cat lingering nearby.</li>
      <li><b>Cleaning detection</b> — a human-only door / lid sensor marks the
          box cleaned when held open long enough, so a cat brushing past the
          sensor never counts as a cleaning.</li>
      <li><b>Dual dirty thresholds</b> — flag the box dirty after a number of
          uses <b>or</b> after a number of hours since the last cleaning,
          whichever comes first.</li>
      <li><b>Mobile push notifications</b> — send a reminder to one or more
          Home Assistant Companion app devices when the box needs cleaning.</li>
      <li><b>Alexa announcements</b> — announce on one or more Echo devices via
          the Alexa Media Player integration.</li>
      <li><b>TTS (text-to-speech) / Speaker announcements</b> — announce on any
          speaker using a Home Assistant TTS engine (Google TTS, Home Assistant
          Voice, Piper, Nabu Casa Cloud, OpenAI, and more). Supports two TTS
          engines for mixed speaker setups.</li>
      <li><b>Quiet hours</b> — suppress reminders during sleeping hours with
          per-channel control (e.g. silence speakers but keep mobile alerts).
          Dashboard helpers still update. Set times manually or use a Schedule
          helper to share quiet hours across multiple automations.</li>
      <li><b>Usage-trend tracking</b> — optionally count every visit into
          lifetime, per-day, and per-week <code>counter</code> helpers so you
          can graph how often the box is used and watch the daily average
          change week over week.</li>
      <li><b>Air purifier boost</b> — optionally run an air purifier or fan
          at a chosen speed a few minutes after the cat leaves, for a set
          time, then put it <b>back exactly how it was</b> (e.g. Auto mode).
          A new visit during the boost extends it.</li>
      <li><b>Dashboard helpers</b> — the dirty <code>input_boolean</code>, the
          last-cleaned <code>input_datetime</code>, and the visit
          <code>counter</code> all double as dashboard indicators.</li>
    </ul>
    </details>

    <details><summary><b>Setup guide</b> 🛠️</summary>
    <p></p>
    <ol>
      <li>Create the four helpers this blueprint needs (you can create each one
          directly from its dropdown using the "Create a new … helper" option,
          no need to leave the blueprint config):
        <ul>
          <li>A <b>Toggle</b> (<code>input_boolean</code>) — e.g.
              "Litter Box Needs Cleaning".</li>
          <li>A <b>Date and/or time</b> (<code>input_datetime</code>) with
              <b>both date and time</b> enabled — e.g. "Litter Box Last
              Cleaned".</li>
          <li>A <b>Counter</b> (<code>counter</code>) — e.g. "Litter Box Times
              Used".</li>
        </ul>
      </li>
      <li>Create an automation from this blueprint.</li>
      <li>In <b>Litter Box — Sensors &amp; Helpers</b>, select your motion
          sensor, your door / lid sensor, and the three helpers above.</li>
      <li>In <b>Dirty Thresholds</b>, choose how many uses and how many hours
          should mark the box dirty.</li>
      <li>(Optional) Fine-tune <b>Detection Tuning</b> if you get double counts
          or missed cleanings.</li>
      <li>(Optional) Enable any of the notification sections — Mobile, Alexa,
          or TTS — to get reminded when the box needs cleaning.</li>
      <li>(Optional) To track usage trends, create one more <b>Counter</b>
          ("Litter Box Lifetime Visits") and select it in <b>Usage Trends</b>.
          See "Usage trends &amp; dashboard graphs" below for the one extra
          helper the graph needs.</li>
      <li>(Optional) To boost an air purifier after visits, create a
          <b>Timer</b> helper (tick <b>Restore</b>; no duration needed — the
          blueprint sets it), then configure the <b>Air Purifier Boost</b>
          section.</li>
      <li>Save the automation. If this is the first time you've added the
          blueprint, restart Home Assistant so it fully loads.</li>
      <li><b>Set a starting point:</b> open your "Last Cleaned" helper and set
          it to now, and reset your visit counter to 0, so the blueprint starts
          from a clean slate.</li>
      <li><b>Test your setup:</b> Go to Developer Tools → Actions →
          <code>automation.trigger</code>, select your LitterMinder automation,
          and run it. This sends a test message to <b>all</b> configured
          notification channels (mobile push, Alexa, TTS speakers) so you can
          verify everything is connected. It does not change any helpers or
          simulate a visit — it only tests notifications.</li>
    </ol>
    <p></p>
    <h4>How cleaning detection works</h4>
    <p>The blueprint marks the box cleaned when the door / lid sensor stays
    <b>open</b> for at least the "minimum door open time" you set. This is what
    separates a real cleaning from a cat nudging the sensor — a cat won't hold
    the door open for 20 seconds. When a cleaning is detected, the visit counter
    resets to 0, the last-cleaned time is set to now, and the dirty flag clears.
    You don't need to wait for the door to close.</p>
    </details>

    <details><summary><b>Quiet hours</b> 🌙</summary>
    <p></p>
    <p>Suppress reminders during quiet hours — with per-channel control. For
    example, silence Alexa and TTS speakers at night while still receiving
    mobile push notifications. Dashboard helpers still update normally, so the
    dirty flag and counter always reflect the current state. Two modes are
    available:</p>
    <ul>
      <li><b>Manual times</b> — set a start and end time. If the end time is
          earlier than the start time, the window wraps over midnight
          (e.g. 10:00 PM to 7:00 AM).</li>
      <li><b>Schedule helper</b> — use a <code>schedule</code> helper entity to
          define quiet hours. When the schedule is "on", reminders are
          suppressed. Useful if you want to share the same quiet hours across
          multiple automations from a single helper.</li>
    </ul>
    </details>

    <details><summary><b>Usage trends &amp; dashboard graphs</b> 📈</summary>
    <p></p>
    <p>Watching how often your cat uses the box each day is one of the easiest
    early health signals you can get. Setup takes three helpers, all created
    in the UI — no YAML:</p>
    <ol>
      <li><b>Lifetime visits counter</b> (required for trends) — create a
          <b>Counter</b> right from the "Total visits — lifetime" dropdown in
          <b>Usage Trends</b>. The blueprint adds 1 per visit and never resets
          it.</li>
      <li><b>Graphable sensor</b> — Home Assistant only keeps long-term
          statistics (the per-day graphs) for <i>sensors</i>, not counters.
          Go to Settings → Devices &amp; services → Helpers → Create helper →
          <b>Template</b> → <b>Template a sensor</b>, and set:
        <ul>
          <li>State: <code>{{ states('counter.YOUR_LIFETIME_COUNTER') }}</code></li>
          <li>State class: <b>Total increasing</b></li>
          <li>Under advanced options, Availability:
              <code>{{ has_value('counter.YOUR_LIFETIME_COUNTER') }}</code>
              — this stops a restart from being counted as a burst of
              visits.</li>
        </ul>
      </li>
      <li><b>Dashboard card</b> — add a <b>Statistics graph</b> card for that
          sensor with Period: <b>Day</b>, Stat type: <b>Change</b>, Chart
          type: <b>Bar</b>, Days to show: <b>14</b>. Each bar is one day's
          visit count. Add a <b>Statistic</b> card (Stat type: Change, Period:
          rolling window of 7 days) for a "visits in the last week" total.</li>
    </ol>
    <p>The optional <b>Visits today</b> counter is handy for a quick "so far
    today" number on a dashboard; it resets at the daily reset time. The
    <b>Visits this week</b> counter is kept for older setups — the statistics
    graph above makes it unnecessary.</p>
    <p>A rising or falling daily average can be an early sign of a health
    change — if you notice a sustained shift, it's worth a chat with your vet.</p>
    </details>

    <details><summary><b>Air purifier boost</b> 💨</summary>
    <p></p>
    <p>Enable the <b>Air Purifier Boost</b> section to clear odor after each
    visit. Works with any <code>fan</code> entity — most smart purifiers
    (Levoit / VeSync, Winix, Xiaomi, etc.) appear as fans.</p>
    <p><b>How it works:</b></p>
    <ol>
      <li>After a visit, once the motion sensor has been clear for your
          <b>start delay</b> (so the fan doesn't spook the cat), the blueprint
          snapshots the purifier's current setting — on/off, Auto/Sleep
          preset, or speed.</li>
      <li>It sets your <b>boost speed</b> and runs for your <b>boost
          duration</b>. Another visit during the boost restarts the clock.</li>
      <li>When the boost ends, the purifier is put back exactly how it was —
          back to Auto, back off, back to its old speed.</li>
    </ol>
    <p>Cleaning the box also triggers a boost, since scooping stirs up odor
    too.</p>
    <p><b>Choosing a boost speed:</b> look at your fan in Developer Tools →
    States. <code>percentage_step</code> tells you which percentages it
    supports (e.g. 25 → 25 / 50 / 75 / 100) and <code>preset_modes</code>
    lists the preset names. For most purifiers, <b>Percentage</b> is the right
    choice for a boost — presets are usually Auto / Sleep.</p>
    <p><b>After a Home Assistant restart</b> mid-boost the snapshot is lost
    (it's kept in memory), so the purifier returns to the <b>fallback
    preset</b> you set instead — e.g. <code>auto</code>. Leave it blank to
    turn the purifier off in that case.</p>
    </details>

    ---

    **Author:** CraveVox
    **Version:** 1.1.0
    **Last updated:** 2026-10-04

  domain: automation
  source_url: https://github.com/cravevox/homeassistant/blob/main/blueprints/automation/litterminder.yaml
  author: CraveVox
  homeassistant:
    min_version: "2024.10.0"

  input:
    # =========================================================================
    #  SECTION 1 — SENSORS & HELPERS
    # =========================================================================
    core_section:
      name: "Litter Box — Sensors & Helpers"
      icon: mdi:cat
      collapsed: false
      description: >
        The sensors that detect usage and cleaning, plus the three helpers
        that store state and double as dashboard indicators.
      input:
        motion_sensor:
          name: "Litter box motion sensor"
          description: >
            A binary sensor that detects motion at the litter box. Each time
            the box is used, this triggers a visit count. Position it so it
            only sees the box, not general room traffic.
          selector:
            entity:
              multiple: false
              filter:
                - domain: binary_sensor

        clean_door_sensor:
          name: "Cleaning door / lid sensor (human-only)"
          description: >
            A binary sensor on the door, lid, or nearby cabinet you open to
            clean the box. Holding it open for the "minimum door open time"
            (set in Detection Tuning) marks the box as cleaned. Choose a
            sensor a cat can't trigger by brushing past.
          selector:
            entity:
              multiple: false
              filter:
                - domain: binary_sensor

        dirty_boolean:
          name: "Dirty / needs-cleaning toggle (input_boolean)"
          description: >
            An input_boolean that turns ON when the box needs cleaning and OFF
            when it's cleaned. Doubles as a dashboard indicator. Use the
            "Create a new Toggle helper" option in the dropdown if you don't
            have one yet (e.g. "Litter Box Needs Cleaning").
          selector:
            entity:
              multiple: false
              filter:
                - domain: input_boolean

        last_cleaned_datetime:
          name: "Last cleaned (input_datetime)"
          description: >
            An input_datetime helper (with BOTH date and time enabled) that
            records when the box was last cleaned. The blueprint reads its
            timestamp attribute, so time zones are handled correctly. Use the
            "Create a new Date and/or time helper" option in the dropdown if
            you don't have one yet (e.g. "Litter Box Last Cleaned").
          selector:
            entity:
              multiple: false
              filter:
                - domain: input_datetime

        usage_counter:
          name: "Times used counter (counter)"
          description: >
            A counter helper that counts visits since the last cleaning. Resets
            to 0 when the box is cleaned. Use the "Create a new Counter helper"
            option in the dropdown if you don't have one yet (e.g. "Litter Box
            Times Used").
          selector:
            entity:
              multiple: false
              filter:
                - domain: counter

    # =========================================================================
    #  SECTION 2 — DIRTY THRESHOLDS
    # =========================================================================
    thresholds_section:
      name: "Dirty Thresholds"
      icon: mdi:broom
      collapsed: true
      description: >
        Choose when the box should be flagged as needing a clean. The dirty
        flag turns on when EITHER threshold is met — whichever comes first.
      input:
        dirty_after_uses:
          name: "Mark dirty after this many uses"
          description: >
            Turn the dirty flag on once the visit counter reaches this many
            uses since the last cleaning.
          default: 5
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: uses
              mode: slider

        dirty_after_hours:
          name: "Mark dirty after this many hours since last cleaned"
          description: >
            Turn the dirty flag on once this many hours have passed since the
            last cleaning, even if the use count is low. Evaluated on every
            visit and re-checked every 15 minutes.
          default: 16
          selector:
            number:
              min: 1
              max: 168
              step: 1
              unit_of_measurement: h
              mode: slider

    # =========================================================================
    #  SECTION 3 — DETECTION TUNING
    # =========================================================================
    tuning_section:
      name: "Detection Tuning"
      icon: mdi:tune
      collapsed: true
      description: >
        Fine-tune how visits and cleanings are detected. The defaults work for
        most setups — adjust these only if you see double counts, missed
        visits, or missed cleanings.
      input:
        min_motion_on_seconds:
          name: "Minimum motion duration to count a visit (seconds)"
          description: >
            The motion sensor must stay ON continuously for this long before a
            visit is counted. Keep this LOW (1–2s): most PIR / occupancy
            sensors pulse on and off during a single visit, so a high value
            means the sensor rarely stays on long enough and visits get
            missed. Raise it only if brief motion (a cat merely walking past)
            causes false counts.
          default: 1
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: s
              mode: slider

        motion_off_cooldown_seconds:
          name: "Cooldown between counted visits (seconds)"
          description: >
            The minimum time that must pass after a counted visit before
            another visit can be counted. Prevents a single visit (where the
            motion sensor flickers on and off) from being counted several
            times. Raise it if one visit is counted multiple times.
          default: 90
          selector:
            number:
              min: 5
              max: 600
              step: 5
              unit_of_measurement: s
              mode: slider

        min_door_open_seconds_for_clean:
          name: "Minimum door open time to count as a cleaning (seconds)"
          description: >
            The cleaning door / lid sensor must stay OPEN for this long before
            a cleaning is recorded. This is what separates a real cleaning from
            a cat nudging the sensor. Raise it if accidental bumps register as
            cleanings; lower it if quick cleanings are missed.
          default: 20
          selector:
            number:
              min: 1
              max: 600
              step: 1
              unit_of_measurement: s
              mode: slider

    # =========================================================================
    #  SECTION 4 — USAGE TRENDS (OPTIONAL)
    # =========================================================================
    trends_section:
      name: "Usage Trends"
      icon: mdi:chart-line
      collapsed: true
      description: >
        Track how many times a day the box is used so you can spot health
        trends. Only the lifetime counter is needed — it feeds the per-day
        graph. See "Usage trends & dashboard graphs" at the top for the
        3-step, no-YAML setup.
      input:
        enable_trends:
          name: Enable usage-trend tracking
          description: >
            If enabled, each counted visit also increments the trend counters
            below.
          default: false
          selector:
            boolean: {}

        total_counter:
          name: "Total visits — lifetime (counter, never resets) — REQUIRED for graphs"
          description: >
            Counts every visit and is never reset by this blueprint. This is
            the source for the per-day statistics graph — without it, trend
            graphs stay at 0. Use the "Create a new Counter helper" option in
            the dropdown (e.g. "Litter Box Lifetime Visits").
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: counter

        daily_counter:
          name: "Visits today (counter, auto-resets daily) — optional"
          description: >
            A "so far today" number for your dashboard. Resets at the daily
            reset time below. Leave blank to skip.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: counter

        weekly_counter:
          name: "Visits this week (counter, auto-resets weekly) — optional"
          description: >
            Counts visits since the weekly reset day below. Kept for older
            setups; the statistics graph makes it unnecessary. Leave blank to
            skip.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: counter

        daily_reset_time:
          name: "Daily reset time"
          description: >
            The time each day when the "Visits today" counter resets to 0
            (local time). The "Visits this week" counter resets at this same
            time on the weekly reset day.
          default: "00:00:00"
          selector:
            time: {}

        weekly_reset_day:
          name: "Weekly reset day"
          description: >
            The day of the week when the "Visits this week" counter resets to 0
            (at the daily reset time).
          default: "0"
          selector:
            select:
              multiple: false
              mode: dropdown
              options:
                - label: Monday
                  value: "0"
                - label: Tuesday
                  value: "1"
                - label: Wednesday
                  value: "2"
                - label: Thursday
                  value: "3"
                - label: Friday
                  value: "4"
                - label: Saturday
                  value: "5"
                - label: Sunday
                  value: "6"

    # =========================================================================
    #  SECTION 5 — AIR PURIFIER BOOST (OPTIONAL)
    # =========================================================================
    purifier_section:
      name: "Air Purifier Boost"
      icon: mdi:air-purifier
      collapsed: true
      description: >
        Run an air purifier or fan at a boost speed after the cat leaves, then
        put it back exactly how it was (e.g. Auto). Needs a Timer helper. See
        "Air purifier boost" at the top for details.
      input:
        enable_purifier:
          name: Enable air purifier boost
          default: false
          selector:
            boolean: {}

        purifier_fan:
          name: "Air purifier / fan"
          description: >
            The fan entity for your purifier (e.g. fan.core_400s_series).
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: fan

        purifier_timer:
          name: "Boost timer (timer helper)"
          description: >
            A Timer helper the blueprint uses to time the boost. Create one with
            the "Create a new Timer helper" option (e.g. "Litter Box Purifier
            Boost") and tick "Restore" so a restart mid-boost still ends it.
            Use one timer per LitterMinder automation.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: timer

        purifier_delay_minutes:
          name: "Start delay — minutes after the cat leaves"
          description: >
            How long the motion sensor must be clear before the boost starts,
            so the fan doesn't startle the cat. 0 starts as soon as motion
            clears.
          default: 2
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider

        purifier_run_minutes:
          name: "Boost duration"
          description: >
            How long to run at boost speed before restoring the purifier's
            previous setting. A new visit during the boost restarts this clock.
          default: 15
          selector:
            number:
              min: 1
              max: 120
              step: 1
              unit_of_measurement: min
              mode: slider

        purifier_speed_mode:
          name: "Boost speed type"
          description: >
            **Percentage** — set a fan speed (best for most purifiers).
            **Preset** — switch to a named preset like "turbo".
            **Just turn on** — turn on without changing the speed.
          default: "percentage"
          selector:
            select:
              multiple: false
              options:
                - label: Percentage
                  value: "percentage"
                - label: Preset mode
                  value: "preset"
                - label: Just turn on
                  value: "on"

        purifier_percentage:
          name: "Boost speed (percentage mode)"
          description: >
            Use a multiple of your fan's percentage_step attribute — e.g. a
            Levoit Core 400S has a step of 25, so 25 / 50 / 75 / 100.
          default: 50
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        purifier_preset:
          name: "Boost preset (preset mode)"
          description: >
            The exact preset name from your fan's preset_modes attribute
            (case-sensitive). Only used if speed type is "Preset mode".
          default: ""
          selector:
            text: {}

        purifier_fallback_preset:
          name: "Fallback preset after a restart"
          description: >
            The purifier's original setting is remembered in memory only. If
            Home Assistant restarts during a boost, the purifier is set to this
            preset instead (e.g. "auto"). Leave blank to turn it off.
          default: ""
          selector:
            text: {}

        purifier_skip_quiet:
          name: "Skip the boost during quiet hours"
          description: >
            If enabled, no boost runs during the quiet hours set in the "Quiet
            hours" section (e.g. keep the purifier in Sleep mode overnight).
          default: false
          selector:
            boolean: {}

    # =========================================================================
    #  SECTION 6 — MOBILE NOTIFICATIONS (OPTIONAL)
    # =========================================================================
    mobile_section:
      name: "Mobile notifications"
      icon: mdi:cellphone
      collapsed: true
      description: >
        Send a push notification to one or more Home Assistant Companion app
        devices when the litter box needs cleaning.
      input:
        send_mobile_notifications:
          name: Enable mobile notifications
          description: >
            If enabled, a push notification is sent to the selected devices
            when the box is flagged as needing cleaning.
          default: false
          selector:
            boolean: {}

        mobile_devices:
          name: Mobile devices
          description: >
            Select one or more Home Assistant Companion app devices to receive
            notifications.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app

        mobile_title:
          name: "Notification title (mobile)"
          description: >
            Title for the mobile push notification.
          default: "LitterMinder"
          selector:
            text: {}

        mobile_message:
          name: "Notification message (mobile)"
          description: >
            Message body for the mobile push notification.
          default: "🐾 The litter box needs cleaning."
          selector:
            text:
              multiline: true

    # =========================================================================
    #  SECTION 7 — ALEXA ANNOUNCEMENTS (OPTIONAL)
    # =========================================================================
    alexa_section:
      name: "Alexa announcements"
      icon: mdi:speaker-message
      collapsed: true
      description: >
        Announce on Amazon Echo devices using the Alexa Media Player
        integration when the box needs cleaning. Requires the Alexa Media
        Player custom component (available via HACS).
      input:
        enable_alexa:
          name: Enable Alexa announcements
          description: >
            If enabled, an announcement plays on the selected Echo devices when
            the box needs cleaning.
          default: false
          selector:
            boolean: {}

        alexa_targets:
          name: Alexa media player targets
          description: >
            Select one or more Echo/Alexa media player entities to announce on.
            These must be media_player entities from the Alexa Media Player
            integration.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player

        alexa_announce_type:
          name: Alexa announcement type
          description: >
            "Announce" plays the standard Alexa chime before the message.
            "TTS" plays the message directly without a chime.
          default: "announce"
          selector:
            select:
              multiple: false
              options:
                - label: Announce (with chime)
                  value: "announce"
                - label: TTS (no chime)
                  value: "tts"

        alexa_service_name:
          name: Alexa notify service name
          description: >
            The name of your Alexa Media Player notify service. Most
            installations use the default "notify.alexa_media", but if you
            renamed it or have multiple Alexa integrations, enter your service
            name here.
          default: "notify.alexa_media"
          selector:
            text: {}

        alexa_message:
          name: "Announcement message (Alexa)"
          description: >
            Message to announce on Alexa when the box needs cleaning.
          default: "The litter box needs cleaning."
          selector:
            text:
              multiline: true

    # =========================================================================
    #  SECTION 8 — TTS / SPEAKER ANNOUNCEMENTS (OPTIONAL)
    # =========================================================================
    tts_section:
      name: "TTS (text-to-speech) / Speaker announcements"
      icon: mdi:speaker-message
      collapsed: true
      description: >
        Announce on any speaker using a Home Assistant TTS (text-to-speech)
        engine — Google TTS, Home Assistant Voice, Piper, Nabu Casa Cloud, and
        more. Supports two TTS engines for mixed speaker setups.
      input:
        enable_tts:
          name: Enable TTS / Speaker announcements
          description: >
            If enabled, a TTS announcement plays on the selected speakers when
            the box needs cleaning. You must also select a TTS engine entity
            and at least one speaker below.
          default: false
          selector:
            boolean: {}

        tts_primary_entity:
          name: Primary TTS engine entity
          description: >
            The TTS engine to use for the primary speakers. The dropdown shows
            whichever TTS integrations you have installed (e.g. Google
            Translate, Piper, Nabu Casa Cloud, OpenAI, Google AI, etc.).
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: tts

        tts_primary_targets:
          name: Primary media player targets
          description: >
            Select one or more media player entities to announce on using the
            primary TTS engine.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player

        tts_secondary_entity:
          name: Secondary TTS engine entity (optional)
          description: >
            Optional second TTS engine for a different set of speakers. Leave
            empty if you only use one TTS engine.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: tts

        tts_secondary_targets:
          name: Secondary media player targets
          description: >
            Select one or more media player entities to announce on using the
            secondary TTS engine.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: media_player

        tts_message:
          name: "Announcement message (TTS)"
          description: >
            Message to announce on TTS speakers when the box needs cleaning.
          default: "The litter box needs cleaning."
          selector:
            text:
              multiline: true

    # =========================================================================
    #  SECTION 9 — QUIET HOURS
    # =========================================================================
    quiet_hours_section:
      name: "Quiet hours"
      icon: mdi:moon-waning-crescent
      collapsed: true
      description: >
        Suppress reminders during quiet hours — choose which channels to
        silence and which to keep. For example, suppress Alexa and TTS speakers
        at night but still receive mobile push notifications. Dashboard helpers
        still update normally. Choose between setting times manually or using a
        Schedule helper to centralize quiet hours across multiple automations.
      input:
        quiet_hours_mode:
          name: Quiet hours mode
          description: >
            **Disabled** — no quiet hours, reminders sent anytime.
            **Manual times** — set start and end times below.
            **Schedule helper** — use a Schedule helper entity. When the
            schedule is "on", reminders are suppressed.
          default: "disabled"
          selector:
            select:
              multiple: false
              mode: dropdown
              options:
                - label: Disabled
                  value: "disabled"
                - label: Manual times (set below)
                  value: "manual"
                - label: Schedule helper
                  value: "schedule"

        quiet_hours_schedule:
          name: "Schedule helper (schedule mode only)"
          description: >
            A Schedule helper entity that defines your quiet hours. When the
            schedule is "on", reminders are suppressed. Only used if quiet
            hours mode is "Schedule helper" above.
          default: ""
          selector:
            entity:
              multiple: false
              filter:
                - domain: schedule

        quiet_hours_start:
          name: "Start time (manual mode only)"
          description: >
            The time quiet hours begin (local time). Only used if quiet hours
            mode is "Manual times" above.
          default: "22:00:00"
          selector:
            time: {}

        quiet_hours_end:
          name: "End time (manual mode only)"
          description: >
            The time quiet hours end (local time). If the end time is earlier
            than the start time, the window wraps over midnight (e.g. 10:00 PM
            to 7:00 AM). Only used if quiet hours mode is "Manual times" above.
          default: "07:00:00"
          selector:
            time: {}

        quiet_hours_channels:
          name: "Channels to suppress during quiet hours"
          description: >
            Select which channels to suppress during quiet hours. Channels
            **not** in this list still send reminders during quiet hours.
          default:
            - "mobile"
            - "alexa"
            - "tts"
          selector:
            select:
              multiple: true
              mode: dropdown
              options:
                - label: Mobile notifications
                  value: "mobile"
                - label: Alexa announcements
                  value: "alexa"
                - label: TTS / Speaker announcements
                  value: "tts"

# =============================================================================
#  ARCHITECTURE
# =============================================================================
# Event-driven (not polling). All five configured entities are REQUIRED, so
# there are no empty-entity issues that would force a polling design.
#
#   Trigger "visit"       — motion ON for the minimum duration -> count a visit
#   Trigger "cleaned"     — door/lid OPEN for the minimum duration -> cleaned
#   Trigger "reevaluate"  — every 15 min -> re-check the hours-since-cleaned
#                           threshold so the box can go dirty on time alone
#   Trigger "trend_reset" — daily reset time -> reset today/week counters
#   Trigger "purifier_start"   — motion clear for the start delay after a
#                                visit/cleaning -> snapshot fan, boost, start timer
#   Trigger "purifier_end"     — boost timer finished -> restore the snapshot
#   Trigger "purifier_recover" — HA start -> a timer that expired while HA was
#                                down fires timer.finished before automations
#                                load, so restore any boost left running
#   Manual (no trigger)   — automation.trigger -> send test notifications only
#
# Purifier boost keeps no wait/delay inside the run (that would block the
# queue): the timer helper holds the boost duration, and the fan's prior
# setting is snapshotted with scene.create and restored with scene.turn_on
# (fan reproduce-state restores on/off, preset_mode and percentage correctly,
# e.g. VeSync "auto" with percentage null).
#
# mode: queued guarantees no trigger is ever dropped (the old design used
# mode: parallel with wait_for_trigger, which could silently drop the cleaning
# trigger when motion runs piled up — the root cause of "cleaning stopped
# updating state"). All actions here are near-instant, so queuing is cheap.
#
# Cleaning uses a `for:` duration on the door OPEN trigger instead of waiting
# for the door to close, so there is no race and no dependency on a close event.
#
# Hours-since-cleaned is computed from the input_datetime `timestamp` attribute
# (always timezone-correct) rather than parsing the state string with
# as_datetime (which is affected by the HA input_datetime timezone quirks —
# see home-assistant/core#174351).
# =============================================================================

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: state
    id: visit
    entity_id: !input motion_sensor
    to: "on"
    for:
      seconds: !input min_motion_on_seconds

  - trigger: state
    id: cleaned
    entity_id: !input clean_door_sensor
    to: "on"
    for:
      seconds: !input min_door_open_seconds_for_clean

  - trigger: time_pattern
    id: reevaluate
    minutes: "/15"

  - trigger: time
    id: trend_reset
    at: !input daily_reset_time

  - trigger: state
    id: purifier_start
    entity_id: !input motion_sensor
    from: "on"
    to: "off"
    for:
      minutes: !input purifier_delay_minutes

  - trigger: event
    id: purifier_end
    event_type: timer.finished
    event_data:
      entity_id: !input purifier_timer

  - trigger: homeassistant
    id: purifier_recover
    event: start

conditions: []

actions:
  # -------------------------------------------------------------------------
  #  Load inputs into variables and compute shared state
  # -------------------------------------------------------------------------
  - variables:
      # Core entities
      door_entity: !input clean_door_sensor
      dirty_bool: !input dirty_boolean
      last_cleaned: !input last_cleaned_datetime
      counter_entity: !input usage_counter

      # Thresholds & tuning
      uses_threshold: !input dirty_after_uses
      hours_threshold: !input dirty_after_hours
      cooldown_seconds: !input motion_off_cooldown_seconds

      # Usage trends
      trends_enabled: !input enable_trends
      total_counter: !input total_counter
      daily_counter: !input daily_counter
      weekly_counter: !input weekly_counter
      weekly_reset_day: !input weekly_reset_day

      # Air purifier boost
      purifier_enabled: !input enable_purifier
      purifier_entity: !input purifier_fan
      purifier_timer_entity: !input purifier_timer
      purifier_delay: !input purifier_delay_minutes
      purifier_run: !input purifier_run_minutes
      purifier_mode: !input purifier_speed_mode
      purifier_pct: !input purifier_percentage
      purifier_preset_var: !input purifier_preset
      purifier_fallback: !input purifier_fallback_preset
      purifier_skip_quiet_var: !input purifier_skip_quiet
      purifier_ready: >-
        {{ purifier_enabled
           and purifier_entity is not none and purifier_entity != ''
           and purifier_timer_entity is not none and purifier_timer_entity != '' }}
      # In-memory snapshot of the fan's prior setting, unique per automation
      purifier_scene_id: "{{ this.entity_id | replace('automation.', '') }}_purifier_snapshot"
      purifier_scene: "scene.{{ purifier_scene_id }}"

      # Notification config
      send_mobile: !input send_mobile_notifications
      mobile_devices_var: !input mobile_devices
      mobile_title_var: !input mobile_title
      mobile_message_var: !input mobile_message
      enable_alexa: !input enable_alexa
      alexa_targets_var: !input alexa_targets
      alexa_type: !input alexa_announce_type
      alexa_svc: !input alexa_service_name
      alexa_message_var: !input alexa_message
      enable_tts: !input enable_tts
      tts_primary_entity_var: !input tts_primary_entity
      tts_primary_targets_var: !input tts_primary_targets
      tts_secondary_entity_var: !input tts_secondary_entity
      tts_secondary_targets_var: !input tts_secondary_targets
      tts_message_var: !input tts_message

      # Quiet hours
      quiet_mode: !input quiet_hours_mode
      quiet_schedule_entity: !input quiet_hours_schedule
      quiet_start: !input quiet_hours_start
      quiet_end: !input quiet_hours_end
      quiet_channels: !input quiet_hours_channels

      # Which trigger fired? ('manual' when run via automation.trigger)
      trig_id: "{{ trigger.id if trigger is not none else 'manual' }}"

      # Hours since the box was last cleaned (timezone-safe via timestamp attr).
      # If never set, treat as 0 so we never nag before first setup.
      hours_since_clean: >-
        {% set ts = state_attr(last_cleaned, 'timestamp') %}
        {% if ts is none %}
          {{ 0 }}
        {% else %}
          {{ ((as_timestamp(now()) - ts) / 3600) | float(0) }}
        {% endif %}

      # Is the dirty flag already on right now?
      currently_dirty: "{{ is_state(dirty_bool, 'on') }}"

      # Quiet hours check (end time is exclusive — reminders resume at the end time)
      is_quiet: >-
        {% if quiet_mode == 'disabled' %}
          {{ false }}
        {% elif quiet_mode == 'schedule' %}
          {% if quiet_schedule_entity is not none and quiet_schedule_entity != '' %}
            {{ states(quiet_schedule_entity) == 'on' }}
          {% else %}
            {{ false }}
          {% endif %}
        {% elif quiet_mode == 'manual' %}
          {% set now_time = now().time() %}
          {% set start = strptime(quiet_start, '%H:%M:%S').time() %}
          {% set end_t = strptime(quiet_end, '%H:%M:%S').time() %}
          {% if start <= end_t %}
            {{ start <= now_time < end_t }}
          {% else %}
            {{ now_time >= start or now_time < end_t }}
          {% endif %}
        {% else %}
          {{ false }}
        {% endif %}

  # -------------------------------------------------------------------------
  #  MANUAL TRIGGER — test all configured notification channels, then stop.
  #  Does not change any helper or simulate a visit.
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ trig_id == 'manual' }}"
    then:
      - if:
          - condition: template
            value_template: "{{ send_mobile and (mobile_devices_var | length > 0) }}"
        then:
          - repeat:
              for_each: "{{ mobile_devices_var }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                  data:
                    title: "LitterMinder — Test"
                    message: "Manual test notification — LitterMinder is working! All notification channels are being tested."
                  continue_on_error: true

      - if:
          - condition: template
            value_template: "{{ enable_alexa and (alexa_targets_var | length > 0) }}"
        then:
          - action: "{{ alexa_svc }}"
            data:
              target: "{{ alexa_targets_var }}"
              message: "LitterMinder test notification. If you can hear this, Alexa announcements are working."
              data:
                type: "{{ alexa_type }}"
            continue_on_error: true

      - if:
          - condition: template
            value_template: >-
              {{ enable_tts and (tts_primary_targets_var | length > 0)
                 and (tts_primary_entity_var | length > 0) }}
        then:
          - repeat:
              for_each: "{{ tts_primary_targets_var }}"
              sequence:
                - action: tts.speak
                  target:
                    entity_id: "{{ tts_primary_entity_var }}"
                  data:
                    media_player_entity_id: "{{ repeat.item }}"
                    message: "LitterMinder test notification. If you can hear this, TTS announcements are working."
                  continue_on_error: true

      - if:
          - condition: template
            value_template: >-
              {{ enable_tts and (tts_secondary_targets_var | length > 0)
                 and (tts_secondary_entity_var | length > 0) }}
        then:
          - repeat:
              for_each: "{{ tts_secondary_targets_var }}"
              sequence:
                - action: tts.speak
                  target:
                    entity_id: "{{ tts_secondary_entity_var }}"
                  data:
                    media_player_entity_id: "{{ repeat.item }}"
                    message: "LitterMinder test notification. If you can hear this, TTS announcements are working."
                  continue_on_error: true

      - stop: "Manual test complete"

  # -------------------------------------------------------------------------
  #  CLEANED — door/lid held open long enough. Reset everything.
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ trig_id == 'cleaned' }}"
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ last_cleaned }}"
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: counter.reset
        target:
          entity_id: "{{ counter_entity }}"
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ dirty_bool }}"
      - stop: "Litter box cleaned"

  # -------------------------------------------------------------------------
  #  TREND RESET — daily reset time. Reset the "today" counter every day, and
  #  the "this week" counter on the chosen weekday. Trend counters only.
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ trig_id == 'trend_reset' and trends_enabled }}"
    then:
      - if:
          - condition: template
            value_template: "{{ daily_counter is not none and daily_counter != '' }}"
        then:
          - action: counter.reset
            target:
              entity_id: "{{ daily_counter }}"
      - if:
          - condition: template
            value_template: >-
              {{ weekly_counter is not none and weekly_counter != ''
                 and now().weekday() == weekly_reset_day | int(0) }}
        then:
          - action: counter.reset
            target:
              entity_id: "{{ weekly_counter }}"
      - stop: "Trend counters reset"

  # -------------------------------------------------------------------------
  #  PURIFIER START — motion clear for the start delay. Boost only if a visit
  #  or cleaning happened recently (counter / last-cleaned changed within the
  #  delay + 30 min), so general motion near the box doesn't start it.
  #  First boost snapshots the fan; a boost already running is just extended.
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ trig_id == 'purifier_start' }}"
    then:
      - if:
          - condition: template
            value_template: >-
              {% set last_activity = [
                   as_timestamp(states[counter_entity].last_changed, 0),
                   as_timestamp(states[last_cleaned].last_changed, 0)] | max %}
              {{ purifier_ready
                 and has_value(purifier_entity)
                 and (as_timestamp(now()) - last_activity)
                     <= purifier_delay | float(0) * 60 + 1800
                 and not (purifier_skip_quiet_var and is_quiet) }}
        then:
          - if:
              - condition: template
                value_template: "{{ is_state(purifier_timer_entity, 'idle') }}"
            then:
              - action: scene.create
                data:
                  scene_id: "{{ purifier_scene_id }}"
                  snapshot_entities: "{{ [purifier_entity] }}"
              - choose:
                  - conditions: "{{ purifier_mode == 'percentage' }}"
                    sequence:
                      - action: fan.turn_on
                        target:
                          entity_id: "{{ purifier_entity }}"
                        data:
                          percentage: "{{ purifier_pct | int }}"
                        continue_on_error: true
                  - conditions: "{{ purifier_mode == 'preset' and purifier_preset_var | length > 0 }}"
                    sequence:
                      - action: fan.turn_on
                        target:
                          entity_id: "{{ purifier_entity }}"
                        data:
                          preset_mode: "{{ purifier_preset_var }}"
                        continue_on_error: true
                default:
                  - action: fan.turn_on
                    target:
                      entity_id: "{{ purifier_entity }}"
                    continue_on_error: true
          # (Re)start the timer — extends a boost that is already running
          - action: timer.start
            target:
              entity_id: "{{ purifier_timer_entity }}"
            data:
              duration: "{{ (purifier_run | int(15)) * 60 }}"
      - stop: "Purifier boost handled"

  # -------------------------------------------------------------------------
  #  PURIFIER END / RECOVER — restore the fan's prior setting from the
  #  snapshot; if the snapshot was lost to a restart, use the fallback preset
  #  (or turn off). On HA start, only act if the timer is idle but the fan is
  #  still sitting at the boost setting (its timer expired while HA was down).
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ trig_id in ['purifier_end', 'purifier_recover'] }}"
    then:
      - if:
          - condition: template
            value_template: >-
              {% if not purifier_ready %}
                {{ false }}
              {% elif trig_id == 'purifier_end' %}
                {{ true }}
              {% else %}
                {{ is_state(purifier_timer_entity, 'idle')
                   and is_state(purifier_entity, 'on')
                   and ((purifier_mode == 'percentage'
                         and state_attr(purifier_entity, 'percentage') == purifier_pct | int)
                     or (purifier_mode == 'preset' and purifier_preset_var != ''
                         and state_attr(purifier_entity, 'preset_mode') == purifier_preset_var)) }}
              {% endif %}
        then:
          - if:
              - condition: template
                value_template: "{{ expand(purifier_scene) | count > 0 }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ purifier_scene }}"
                continue_on_error: true
            else:
              - if:
                  - condition: template
                    value_template: "{{ purifier_fallback | length > 0 }}"
                then:
                  - action: fan.turn_on
                    target:
                      entity_id: "{{ purifier_entity }}"
                    data:
                      preset_mode: "{{ purifier_fallback }}"
                    continue_on_error: true
                else:
                  - action: fan.turn_off
                    target:
                      entity_id: "{{ purifier_entity }}"
                    continue_on_error: true
      - stop: "Purifier restore handled"

  # -------------------------------------------------------------------------
  #  VISIT — motion held on long enough. Count it (respecting cooldown),
  #  unless the box is currently being cleaned (door open).
  # -------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ trig_id == 'visit' }}"
    then:
      - if:
          - condition: state
            entity_id: !input clean_door_sensor
            state: "off"
          - condition: template
            value_template: >-
              {{ (as_timestamp(now()) - as_timestamp(states[counter_entity].last_changed))
                 >= cooldown_seconds | float(0) }}
        then:
          - action: counter.increment
            target:
              entity_id: "{{ counter_entity }}"

          # Usage-trend counters (never reset by cleaning)
          - if:
              - condition: template
                value_template: >-
                  {{ trends_enabled and total_counter is not none and total_counter != '' }}
            then:
              - action: counter.increment
                target:
                  entity_id: "{{ total_counter }}"
          - if:
              - condition: template
                value_template: >-
                  {{ trends_enabled and (total_counter is none or total_counter == '') }}
            then:
              - action: system_log.write
                data:
                  level: warning
                  logger: blueprints.litterminder
                  message: >-
                    {{ this.attributes.friendly_name }}: usage trends are enabled
                    but no lifetime counter is selected, so trend graphs will stay
                    at 0. Select one under Usage Trends.
          - if:
              - condition: template
                value_template: >-
                  {{ trends_enabled and daily_counter is not none and daily_counter != '' }}
            then:
              - action: counter.increment
                target:
                  entity_id: "{{ daily_counter }}"
          - if:
              - condition: template
                value_template: >-
                  {{ trends_enabled and weekly_counter is not none and weekly_counter != '' }}
            then:
              - action: counter.increment
                target:
                  entity_id: "{{ weekly_counter }}"
        else:
          - stop: "Visit ignored (box being cleaned or within cooldown)"

  # -------------------------------------------------------------------------
  #  EVALUATE DIRTY — runs for 'visit' and 'reevaluate'. Reads the counter
  #  live so it reflects the increment above. Turns the flag on (and notifies)
  #  only on the transition from clean -> dirty.
  # -------------------------------------------------------------------------
  - variables:
      uses_now: "{{ states(counter_entity) | int(0) }}"
      should_be_dirty: >-
        {{ (uses_now | int(0) >= uses_threshold | int(0))
           or (hours_since_clean | float(0) >= hours_threshold | float(0)) }}

  - if:
      - condition: template
        value_template: "{{ should_be_dirty and not currently_dirty }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ dirty_bool }}"

      # Mobile push
      - if:
          - condition: template
            value_template: >-
              {{ send_mobile and (mobile_devices_var | length > 0)
                 and (not is_quiet or 'mobile' not in quiet_channels) }}
        then:
          - repeat:
              for_each: "{{ mobile_devices_var }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                  data:
                    title: "{{ mobile_title_var }}"
                    message: "{{ mobile_message_var }}"
                  continue_on_error: true

      # Alexa announcement
      - if:
          - condition: template
            value_template: >-
              {{ enable_alexa and (alexa_targets_var | length > 0)
                 and (not is_quiet or 'alexa' not in quiet_channels) }}
        then:
          - action: "{{ alexa_svc }}"
            data:
              target: "{{ alexa_targets_var }}"
              message: "{{ alexa_message_var }}"
              data:
                type: "{{ alexa_type }}"
            continue_on_error: true

      # TTS — primary engine
      - if:
          - condition: template
            value_template: >-
              {{ enable_tts and (tts_primary_targets_var | length > 0)
                 and (tts_primary_entity_var | length > 0)
                 and (not is_quiet or 'tts' not in quiet_channels) }}
        then:
          - repeat:
              for_each: "{{ tts_primary_targets_var }}"
              sequence:
                - action: tts.speak
                  target:
                    entity_id: "{{ tts_primary_entity_var }}"
                  data:
                    media_player_entity_id: "{{ repeat.item }}"
                    message: "{{ tts_message_var }}"
                  continue_on_error: true

      # TTS — secondary engine (optional)
      - if:
          - condition: template
            value_template: >-
              {{ enable_tts and (tts_secondary_targets_var | length > 0)
                 and (tts_secondary_entity_var | length > 0)
                 and (not is_quiet or 'tts' not in quiet_channels) }}
        then:
          - repeat:
              for_each: "{{ tts_secondary_targets_var }}"
              sequence:
                - action: tts.speak
                  target:
                    entity_id: "{{ tts_secondary_entity_var }}"
                  data:
                    media_player_entity_id: "{{ repeat.item }}"
                    message: "{{ tts_message_var }}"
                  continue_on_error: true
